<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyCamp — бесплатный курс по Python</title>
<style>
:root{
  --bg:#1b1b32;
  --bg-2:#232345;
  --bg-3:#2a2a55;
  --panel:#0f172a;
  --border:#3a3a6a;
  --text:#f5f6f7;
  --muted:#a8a8c8;
  --accent:#f1be32;
  --accent-2:#ffcf40;
  --green:#2ecc71;
  --green-dark:#00471b;
  --blue:#1d6fb8;
  --red:#e74c3c;
  --purple:#9b59b6;
  --code-bg:#0d1120;
  --radius:10px;
  --mono:"Fira Code","JetBrains Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  font-size:15px;line-height:1.6;overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-size:14px;transition:.15s}
button:active{transform:translateY(1px)}

/* ---------- Topbar ---------- */
.topbar{
  height:56px;display:flex;align-items:center;gap:16px;padding:0 18px;
  background:var(--bg-2);border-bottom:1px solid var(--border);position:relative;z-index:40;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;white-space:nowrap}
.brand .logo{font-size:22px}
.brand span{color:var(--accent)}
.brand small{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.progress-wrap{display:flex;align-items:center;gap:10px;margin-left:auto;min-width:180px}
.progress-bar{flex:1;height:12px;background:var(--bg);border-radius:20px;overflow:hidden;border:1px solid var(--border)}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--green),#7bed9f);border-radius:20px;transition:width .4s}
.progress-text{font-size:13px;color:var(--muted);min-width:70px;text-align:right}
.menu-btn{display:none;background:var(--bg-3);color:var(--text);padding:6px 12px;font-size:18px}
.tb-btn{background:var(--bg-3);color:var(--text);padding:7px 12px;font-size:13px}
.tb-btn:hover{background:var(--border)}

/* ---------- Layout ---------- */
.layout{display:flex;height:calc(100vh - 56px)}
.sidebar{
  width:320px;flex-shrink:0;background:var(--bg-2);border-right:1px solid var(--border);
  overflow-y:auto;padding-bottom:40px;
}
.sidebar-head{padding:16px;font-weight:700;border-bottom:1px solid var(--border);color:var(--accent);letter-spacing:.5px}
.module{border-bottom:1px solid rgba(58,58,106,.5)}
.module-head{
  display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none;font-weight:600;
}
.module-head:hover{background:var(--bg-3)}
.module-head .chev{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:12px}
.module.open .chev{transform:rotate(90deg)}
.module-icon{font-size:17px}
.module-count{margin-left:auto;font-size:11px;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:20px}
.module.open .module-count{display:none}
.lessons{max-height:0;overflow:hidden;transition:max-height .3s ease}
.module.open .lessons{max-height:1200px}
.lesson-link{
  display:flex;align-items:center;gap:10px;padding:9px 16px 9px 40px;cursor:pointer;font-size:13.5px;color:var(--muted);
  border-left:3px solid transparent;
}
.lesson-link:hover{background:var(--bg-3);color:var(--text)}
.lesson-link.active{background:var(--bg-3);color:var(--text);border-left-color:var(--accent)}
.lesson-link .check{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px}
.lesson-link.done .check{background:var(--green);border-color:var(--green);color:#03210f}
.lesson-link.done{color:#8fdcae}

/* ---------- Main ---------- */
.main{flex:1;overflow-y:auto;background:var(--bg)}
.lesson-head{padding:22px 28px 10px}
.lesson-crumbs{font-size:12px;color:var(--muted);margin-bottom:6px}
.lesson-title{font-size:26px;font-weight:700}
.lesson-title .badge{font-size:11px;background:var(--purple);color:#fff;padding:2px 10px;border-radius:20px;vertical-align:middle;margin-left:10px}
.workspace{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:16px 28px 60px;align-items:start}
@media(max-width:1100px){.workspace{grid-template-columns:1fr}}

.card{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-head{padding:10px 16px;background:var(--bg-3);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-body{padding:16px}

/* Theory */
.theory{font-size:15px}
.theory p{margin:0 0 12px}
.theory h3{margin:18px 0 8px;color:var(--accent);font-size:17px}
.theory ul,.theory ol{margin:0 0 12px 22px}
.theory li{margin-bottom:6px}
.theory code{background:var(--code-bg);padding:2px 6px;border-radius:5px;font-family:var(--mono);font-size:13.5px;color:#ffd479}
.theory pre{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:0 0 14px;font-family:var(--mono);font-size:13.5px;line-height:1.55}
.theory pre code{background:none;padding:0;color:#e6edf3}
.theory .tip{background:rgba(46,204,113,.1);border-left:3px solid var(--green);padding:10px 14px;border-radius:6px;margin:0 0 14px;font-size:14px}
.theory .warn{background:rgba(241,190,50,.1);border-left:3px solid var(--accent);padding:10px 14px;border-radius:6px;margin:0 0 14px;font-size:14px}
.task-title{color:var(--green);font-weight:700;margin:18px 0 8px;display:flex;align-items:center;gap:8px}

/* Editor */
.editor-wrap{position:relative;background:var(--code-bg);display:flex;height:290px;font-family:var(--mono);font-size:13.5px;line-height:1.55}
.gutter{
  width:44px;flex-shrink:0;background:#0a0e1a;color:#4a5578;text-align:right;padding:12px 8px 12px 0;
  overflow:hidden;user-select:none;border-right:1px solid var(--border);white-space:pre;
}
.code-area{position:relative;flex:1;overflow:hidden}
.code-highlight,.code-input{
  position:absolute;inset:0;padding:12px 14px;font-family:var(--mono);font-size:13.5px;line-height:1.55;
  white-space:pre;overflow:auto;border:none;outline:none;tab-size:4;
}
.code-highlight{pointer-events:none;color:#e6edf3;z-index:1}
.code-input{background:transparent;color:transparent;caret-color:var(--accent);resize:none;z-index:2}
.code-input::selection{background:rgba(241,190,50,.3)}
.tok-kw{color:#ff7edb;font-weight:600}
.tok-str{color:#7ee787}
.tok-num{color:#79c0ff}
.tok-com{color:#6b7a99;font-style:italic}
.tok-bi{color:#ffa657}
.tok-fn{color:#d2a8ff}

.toolbar{display:flex;gap:8px;padding:10px 14px;background:var(--bg-3);border-top:1px solid var(--border);flex-wrap:wrap}
.btn{padding:8px 16px;font-weight:600}
.btn-run{background:var(--green-dark);color:#7bed9f;border:1px solid #1e7a45}
.btn-run:hover{background:#0a5c2a}
.btn-check{background:var(--blue);color:#fff}
.btn-check:hover{background:#2a82d0}
.btn-ghost{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--accent)}
.btn-spacer{flex:1}

.console{
  background:#05070f;color:#d3e0f0;font-family:var(--mono);font-size:13px;padding:12px 14px;
  min-height:90px;max-height:220px;overflow:auto;white-space:pre-wrap;line-height:1.5;
  border-top:1px solid var(--border);
}
.console .lbl{color:#5b6a8a}
.err{color:#ff6b6b}

.results{padding:12px 14px;border-top:1px solid var(--border);background:var(--bg-2)}
.result-row{display:flex;gap:10px;padding:8px 10px;border-radius:7px;font-size:13.5px;margin-bottom:6px;align-items:flex-start}
.result-row.pass{background:rgba(46,204,113,.12);border-left:3px solid var(--green)}
.result-row.fail{background:rgba(231,76,60,.12);border-left:3px solid var(--red)}
.result-row .ico{font-weight:700}
.result-row.pass .ico{color:var(--green)}
.result-row.fail .ico{color:var(--red)}
.result-row .detail{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px;white-space:pre-wrap}
.banner{padding:12px 16px;border-radius:8px;margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:10px}
.banner.ok{background:rgba(46,204,113,.15);color:#7bed9f;border:1px solid var(--green)}
.banner.no{background:rgba(231,76,60,.15);color:#ff9b8f;border:1px solid var(--red)}

.hint-box{display:none;background:rgba(155,89,182,.12);border-left:3px solid var(--purple);padding:10px 14px;margin-top:10px;border-radius:6px;font-size:13.5px}
.hint-box.show{display:block}

footer.bottombar{padding:14px 28px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--border);text-align:center}
footer.bottombar a{color:var(--accent);text-decoration:none}

.solution-code{display:none;margin-top:10px}
.solution-code.show{display:block}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3a3a6a;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#4d4d85}

@media(max-width:820px){
  .menu-btn{display:block}
  .sidebar{position:fixed;top:56px;bottom:0;left:-330px;z-index:50;transition:left .3s}
  .sidebar.open{left:0;box-shadow:6px 0 24px rgba(0,0,0,.5)}
  .progress-wrap{min-width:120px}
  .brand small{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="menu-btn" id="menuBtn" title="Меню">☰</button>
  <div class="brand"><span class="logo">🐍</span><span>PyCamp</span><small>бесплатный курс по Python</small></div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-text" id="progressText">0%</span>
  </div>
  <button class="tb-btn" id="resetBtn" title="Сбросить прогресс">↺ Сброс</button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">📚 Программа курса</div>
    <nav id="courseTree"></nav>
  </aside>

  <main class="main" id="main">
    <div class="lesson-head">
      <div class="lesson-crumbs" id="crumbs"></div>
      <h1 class="lesson-title" id="lessonTitle">Загрузка…</h1>
    </div>
    <div class="workspace">
      <section class="card">
        <div class="card-head">📖 Теория и задание</div>
        <div class="card-body">
          <div class="theory" id="theoryPane"></div>
          <div class="task-title" id="taskTitle"></div>
          <div class="theory" id="taskPane"></div>
          <button class="btn btn-ghost" id="hintBtn" style="margin-top:10px">💡 Подсказка</button>
          <div class="hint-box" id="hintBox"></div>
          <div class="solution-code" id="solutionBox"></div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">💻 Редактор кода <span style="margin-left:auto;font-weight:400;color:var(--muted);font-size:12px">Ctrl+Enter — запуск</span></div>
        <div class="editor-wrap">
          <div class="gutter" id="gutter">1</div>
          <div class="code-area">
            <pre class="code-highlight" id="highlight"><code></code></pre>
            <textarea class="code-input" id="code" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
          </div>
        </div>
        <div class="toolbar">
          <button class="btn btn-run" id="runBtn">▶ Запустить</button>
          <button class="btn btn-check" id="checkBtn">✓ Проверить</button>
          <button class="btn btn-ghost" id="resetCodeBtn">↺ Сбросить код</button>
          <span class="btn-spacer"></span>
          <button class="btn btn-ghost" id="solutionBtn">👁 Решение</button>
        </div>
        <div class="console" id="console"><span class="lbl">Здесь появится вывод программы…</span></div>
        <div class="results" id="results" style="display:none"></div>
      </section>
    </div>
    <footer class="bottombar">
      PyCamp — учебный проект. Python-движок работает полностью в браузере, без интернета.
    </footer>
  </main>
</div>

<script>
"use strict";
/* =========================================================================
   1. ДВИЖОК PYTHON (подмножество языка на JavaScript)
   Лексер -> Парсер (AST) -> Вычислитель с областями видимости
   ========================================================================= */

function PyError(msg, line){
  const e = new Error(msg);
  e.pyMsg = msg;
  e.line = line || 0;
  e.isPy = true;
  return e;
}
function pyTypeName(v){
  if(v===null) return 'NoneType';
  if(typeof v==='boolean') return 'bool';
  if(typeof v==='number') return Number.isInteger(v)?'int':'float';
  if(typeof v==='string') return 'str';
  if(Array.isArray(v)) return 'list';
  if(v instanceof PyTuple) return 'tuple';
  if(v instanceof PyDict) return 'dict';
  if(v instanceof PySet) return 'set';
  if(v instanceof PyFunc) return 'function';
  if(v instanceof PyBuiltin) return 'builtin_function_or_method';
  if(v instanceof PyClass) return 'type';
  if(v instanceof PyInstance) return v.cls.name;
  if(v instanceof PyModule) return 'module';
  if(v instanceof PyRange) return 'range';
  return 'object';
}
function typeErr(op, a, b){
  return PyError("TypeError: unsupported operand type(s) for "+op+": '"+pyTypeName(a)+"' and '"+pyTypeName(b)+"'");
}
function toNum(v){
  if(typeof v==='number') return v;
  if(typeof v==='boolean') return v?1:0;
  throw PyError("TypeError: unsupported operand type");
}

const PY_KEYWORDS = new Set(['if','elif','else','for','while','def','return','break','continue','pass','and','or','not','in','is','import','from','as','class','try','except','finally','raise','lambda','global','nonlocal','with','del','assert','yield']);
const BUILTIN_NAMES = new Set(['print','input','len','range','int','float','str','bool','list','tuple','dict','set','sum','min','max','abs','round','pow','sorted','reversed','enumerate','zip','type','isinstance','ord','chr','hex','bin','oct','any','all','map','filter','divmod','repr','format']);

/* ------------------------- ЛЕКСЕР ------------------------- */
function tokenize(src){
  src = String(src).replace(/\r\n?/g,'\n').replace(/\t/g,'    ');
  const toks = [];
  const indents = [0];
  let i=0; const n=src.length; let line=1; let atStart=true; let paren=0;
  const P=(t,v)=>toks.push({t:t,v:v,line:line});
  const isDigit=c=>c>='0'&&c<='9';
  const isIdStart=c=>/[A-Za-z_]/.test(c);
  const isId=c=>/[A-Za-z0-9_]/.test(c);

  while(i<n){
    if(atStart && paren===0){
      let j=i, ind=0;
      while(j<n && src[j]===' '){ind++;j++;}
      if(j>=n) break;
      if(src[j]==='\n'){ i=j+1; line++; continue; }
      if(src[j]==='#' && ind>=0){ while(j<n&&src[j]!=='\n')j++; if(j>=n)break; i=j+1; line++; continue; }
      if(ind>indents[indents.length-1]){ indents.push(ind); P('INDENT',ind); }
      else{ while(ind<indents[indents.length-1]){ indents.pop(); P('DEDENT',ind); }
            if(ind!==indents[indents.length-1]) throw PyError('IndentationError: unindent does not match any outer indentation level', line); }
      i=j; atStart=false; continue;
    }
    const c=src[i];
    if(c==='\n'){ if(paren>0){i++;line++;continue;} P('NEWLINE',null); i++; line++; atStart=true; continue; }
    if(c===' '||c==='\t'){ i++; continue; }
    if(c==='#'){ while(i<n&&src[i]!=='\n')i++; continue; }

    // строки с возможным префиксом (f, r, b, u)
    let pre='';
    if(/[fFrRbBuU]/.test(c)){
      let k=i; while(k<n && /[fFrRbBuU]/.test(src[k]) && k-i<2) k++;
      if(k<n && (src[k]==='"'||src[k]==="'")){ pre=src.slice(i,k); i=k; }
    }
    if(src[i]==='"'||src[i]==="'"){
      const q=src[i]; let triple=false;
      if(src[i+1]===q&&src[i+2]===q){ triple=true; i+=3; } else i+=1;
      let out=''; let closed=false;
      while(i<n){
        if(triple){ if(src[i]===q&&src[i+1]===q&&src[i+2]===q){ i+=3; closed=true; break; } }
        else { if(src[i]===q){ i+=1; closed=true; break; } }
        if(src[i]==='\\'){
          const nx=src[i+1]; const map={'n':'\n','t':'\t','r':'\r','\\':'\\',"'":"'",'"':'"','0':'\0'};
          if(nx in map){ out+=map[nx]; i+=2; continue; }
          if(nx==='\n'){ i+=2; line++; continue; }
          out+=src[i+1]; i+=2; continue;
        }
        if(src[i]==='\n'){ if(!triple) throw PyError('SyntaxError: EOL while scanning string literal', line); out+='\n'; i++; line++; continue; }
        out+=src[i]; i++;
      }
      if(!closed) throw PyError('SyntaxError: unterminated string literal (detected at line '+line+')', line);
      P(pre.toLowerCase().includes('f')?'FSTRING':'STRING', out);
      continue;
    }
    if(isDigit(c) || (c==='.'&&isDigit(src[i+1]))){
      let k=i;
      if(src[i]==='0'&&(src[i+1]==='x'||src[i+1]==='X')){ k=i+2; while(k<n&&/[0-9a-fA-F_]/.test(src[k]))k++; P('NUMBER',parseInt(src.slice(i+2,k).replace(/_/g,''),16)); i=k; continue; }
      if(src[i]==='0'&&(src[i+1]==='b'||src[i+1]==='B')){ k=i+2; while(k<n&&/[01_]/.test(src[k]))k++; P('NUMBER',parseInt(src.slice(i+2,k).replace(/_/g,''),2)); i=k; continue; }
      if(src[i]==='0'&&(src[i+1]==='o'||src[i+1]==='O')){ k=i+2; while(k<n&&/[0-7_]/.test(src[k]))k++; P('NUMBER',parseInt(src.slice(i+2,k).replace(/_/g,''),8)); i=k; continue; }
      while(k<n&&/[0-9_]/.test(src[k]))k++;
      if(src[k]==='.'){ k++; while(k<n&&/[0-9_]/.test(src[k]))k++; }
      if(src[k]==='e'||src[k]==='E'){ let m=k+1; if(src[m]==='+'||src[m]==='-')m++; if(isDigit(src[m])){ k=m; while(k<n&&isDigit(src[k]))k++; } }
      P('NUMBER', parseFloat(src.slice(i,k).replace(/_/g,'')));
      i=k; continue;
    }
    if(isIdStart(c)){
      let k=i; while(k<n&&isId(src[k]))k++;
      const w=src.slice(i,k); i=k;
      if(w==='True'){ P('BOOL',true); }
      else if(w==='False'){ P('BOOL',false); }
      else if(w==='None'){ P('NONE',null); }
      else if(PY_KEYWORDS.has(w)){ P('KW',w); }
      else P('NAME',w);
      continue;
    }
    const three=src.substr(i,3), two=src.substr(i,2);
    if(['**=','//=','...'].includes(three)){ P('OP',three); i+=3; continue; }
    if(['**','//','==','!=','<=','>=','+=','-=','*=','/=','%=','->',':=','<<','>>'].includes(two)){ P('OP',two); i+=2; continue; }
    if('+-*/%<>=()[]{}.,:;'.includes(c)){ if('([{'.includes(c))paren++; if(')]}'.includes(c))paren--; P('OP',c); i++; continue; }
    throw PyError('SyntaxError: invalid character '+JSON.stringify(c)+' (line '+line+')', line);
  }
  if(!toks.length || toks[toks.length-1].t!=='NEWLINE') P('NEWLINE',null);
  while(indents.length>1){ indents.pop(); P('DEDENT',0); }
  P('EOF',null);
  return toks;
}

/* ------------------------- ПАРСЕР ------------------------- */
class Parser{
  constructor(toks){ this.toks=toks; this.p=0; }
  peek(k){ return this.toks[this.p+(k||0)]; }
  next(){ return this.toks[this.p++]; }
  at(t,v){ const x=this.peek(); return x.t===t && (v===undefined || x.v===v); }
  expect(t,v){
    if(!this.at(t,v)){ const x=this.peek();
      throw PyError('SyntaxError: expected '+(v?("'"+v+"'"):t)+' but got '+(x.t==='NAME'||x.t==='KW'||x.t==='OP'?("'"+x.v+"'"):x.t), x.line); }
    return this.next();
  }
  skipNL(){ while(this.at('NEWLINE')) this.next(); }

  parseProgram(){
    const body=[]; this.skipNL();
    while(!this.at('EOF')){ body.push(this.parseStatement()); this.skipNL(); }
    return {type:'Program', body:body};
  }
  parseStatement(){
    const t=this.peek();
    if(t.t==='KW'){
      switch(t.v){
        case 'if': return this.parseIf();
        case 'while': return this.parseWhile();
        case 'for': return this.parseFor();
        case 'def': return this.parseDef();
        case 'class': return this.parseClass();
        case 'return': { this.next(); let v=null; if(!this.at('NEWLINE')&&!this.at('EOF')&&!this.at('DEDENT')) v=this.parseTupleTail(this.parseExpression()); return {type:'Return', value:v}; }
        case 'break': this.next(); return {type:'Break'};
        case 'continue': this.next(); return {type:'Continue'};
        case 'pass': this.next(); return {type:'Pass'};
        case 'import': return this.parseImport();
        case 'from': return this.parseFromImport();
        case 'try': return this.parseTry();
        case 'raise': { this.next(); let v=null; if(!this.at('NEWLINE')&&!this.at('EOF')) v=this.parseExpression(); return {type:'Raise', value:v}; }

      const value=this.parseExpression();
      return {type:'AugAssign', target:first, op:op, value:value};
    }
    return {type:'ExprStmt', expr:first};
  }

  parseTupleTail(first){
    if(this.at('OP',',')){
      const items=[first];
      while(this.at('OP',',')){ this.next(); if(this.at('OP','=')||this.at('NEWLINE')||this.at('EOF')||this.at('DEDENT')||this.at('OP',')')) break; items.push(this.parseExpression()); }

  parseUnary(){

  parsePower(){

  parsePostfix(){

      this.expect('OP',')');

    }
    if(t.t==='OP' && t.v==='['){
      this.next();
      const items=[];
      while(!this.at('OP',']')){ items.push(this.parseExpression()); if(this.at('OP',','))this.next(); else break; }

        return {type:'Set', items:items};

  }
}

/* ------------------------- ЗНАЧИМЫЕ ТИПЫ ------------------------- */
class PyTuple{ constructor(items){ this.items=items; } }
class PyRange{ constructor(start,stop,step){ this.start=start;this.stop=stop;this.step=step||1; }
  toArray(){ const a=[]; if(this.step>0){ for(let x=this.start;x<this.stop;x+=this.step)a.push(x); } else { for(let x=this.start;x>this.stop;x+=this.step)a.push(x); } return a; } }
class PyDict{ constructor(){ this.map=new Map(); }
  get(k){ return this.map.get(hashKey(k)); }
  has(k){ return this.map.has(hashKey(k)); }
  set(k,v){ this.map.set(hashKey(k),v); }
  del(k){ this.map.delete(hashKey(k)); }
  keys(){ return Array.from(this.map.values()).map(e=>e[0]); }
  values(){ return Array.from(this.map.values()).map(e=>e[1]); }
  entries(){ return Array.from(this.map.values()); }
  clone(){ const d=new PyDict(); for(const e of this.map.values()) d.map.set(hashKey(e[0]),[e[0],e[1]]); return d; } }
function hashKey(k){ if(k===null)return 'n:None'; if(typeof k==='boolean')return 'b:'+(k?1:0); if(typeof k==='number'&&Number.isInteger(k))return 'i:'+k; return 'r:'+pyRepr(k); }
class PySet{ constructor(){ this.set=new Set(); this.arr=[]; }
  add(v){ const h=hashKey(v); if(!this.set.has(h)){ this.set.add(h); this.arr.push(v); } }
  has(v){ return this.set.has(hashKey(v)); }
  del(v){ const h=hashKey(v); if(this.set.has(h)){ this.set.delete(h); this.arr=this.arr.filter(x=>hashKey(x)!==h); } }
  values(){ return this.arr.slice(); } }
class PyFunc{ constructor(name,params,vararg,kwarg,body,closure,isLambda){ this.name=name;this.params=params;this.vararg=vararg;this.kwarg=kwarg;this.body=body;this.closure=closure;this.isLambda=isLambda; } }
class PyBuiltin{ constructor(name,fn,self){ this.name=name; this.fn=fn; this.self=self; } }
class PyClass{ constructor(name,bases,methods){ this.name=name; this.bases=bases||[]; this.methods=methods; } }
class PyInstance{ constructor(cls){ this.cls=cls; this.attrs=new Map(); } }
class PyModule{ constructor(name,members){ this.name=name; this.members=members; } }
class PyExc{ constructor(name){ this.name=name; } }
const EXC_NAMES=['Exception','BaseException','ValueError','TypeError','KeyError','IndexError','ZeroDivisionError','NameError','AttributeError','RuntimeError','StopIteration','ImportError','FileNotFoundError','AssertionError','OverflowError','NotImplementedError','EOFError','SyntaxError','IndentationError','RecursionError'];
function pyExcMatch(excType, emsg){
  if(!excType || !(excType instanceof PyExc)) return true;
  if(!emsg) return false;
  const head=String(emsg).split(':')[0];
  if(excType.name===head) return true;
  if(excType.name==='Exception'||excType.name==='BaseException') return true;
  const family={'ZeroDivisionError':['ArithmeticError'],'OverflowError':['ArithmeticError'],'IndexError':['LookupError'],'KeyError':['LookupError'],'IndentationError':['SyntaxError']};
  const fam=family[head]||[];
  return fam.indexOf(excType.name)>=0;

const PY_NATIVE_KINDS={int:1,float:1,str:1,list:1,dict:1,tuple:1,set:1,bool:1};

/* ------------------------- ВЫВОД / REPR ------------------------- */
function pyRepr(v){
  if(v instanceof PyInstance&&v.cls instanceof PyExc) return v.cls.name+(v.attrs.has('args')?'('+pyStr(v.attrs.get('args'))+')':'');
  if(v===null||v===undefined) return 'None';
  if(v===true) return 'True';
  if(v===false) return 'False';
  if(typeof v==='number'){ if(Number.isInteger(v)) return String(v); return String(v); }
  if(typeof v==='string') return '"'+v.replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,'\\n').replace(/\t/g,'\\t')+'"';
  if(Array.isArray(v)) return '['+v.map(pyRepr).join(', ')+']';
  if(v instanceof PyTuple){ if(v.items.length===1) return '('+pyRepr(v.items[0])+',)'; return '('+v.items.map(pyRepr).join(', ')+')'; }
  if(v instanceof PyDict) return '{'+v.entries().map(e=>pyRepr(e[0])+': '+pyRepr(e[1])).join(', ')+'}';
  if(v instanceof PySet){ if(!v.values().length) return 'set()'; return '{'+v.values().map(pyRepr).join(', ')+'}'; }
  if(v instanceof PyRange) return 'range('+v.start+', '+v.stop+')';
  if(v instanceof PyFunc||v instanceof PyBuiltin){ const cls=v instanceof PyFunc?'function':'builtin_function_or_method'; return '<'+cls+' '+(v.name||'')+'>'; }
  if(v instanceof PyClass) return "<class '__main__."+v.name+"'>";
  if(v instanceof PyInstance) return '<'+v.cls.name+' object>';
  if(v instanceof PyModule) return "<module '"+v.name+"'>";
  return String(v);
}
function pyStr(v){
  if(typeof v==='string') return v;
  if(v instanceof PyInstance&&v.cls instanceof PyExc){
    const a=v.attrs.get('args');
    let inside='';
    if(a instanceof PyTuple) inside=a.items.map(pyStr).join(', ');
    else if(a!==null&&a!==undefined) inside=pyStr(a);
    return inside;
  }
  return pyRepr(v);
}
function pyTruthy(v){
  if(v===null||v===undefined||v===false) return false;
  if(v===true) return true;
  if(typeof v==='number') return v!==0;
  if(typeof v==='string') return v.length>0;
  if(Array.isArray(v)) return v.length>0;
  if(v instanceof PyTuple) return v.items.length>0;
  if(v instanceof PyDict) return v.entries().length>0;
  if(v instanceof PySet) return v.values().length>0;
  if(v instanceof PyRange) return v.toArray().length>0;
  return true;
}
function iterableOf(v){
  if(Array.isArray(v)) return v.slice();
  if(typeof v==='string') return v.split('');
  if(v instanceof PyTuple) return v.items.slice();
  if(v instanceof PyRange) return v.toArray();
  if(v instanceof PyDict) return v.keys();
  if(v instanceof PySet) return v.values();
  throw PyError("TypeError: '"+pyTypeName(v)+"' object is not iterable");
}

/* ------------------------- ОКРУЖЕНИЕ ------------------------- */
class Env{
  constructor(parent){ this.vars=new Map(); this.parent=parent||null; }
  get(name){
    let e=this;
    while(e){ if(e.vars.has(name)) return e.vars.get(name); e=e.parent; }
    throw PyError("NameError: name '"+name+"' is not defined");
  }
  has(name){ let e=this; while(e){ if(e.vars.has(name))return true; e=e.parent; } return false; }
  setLocal(name,val){ this.vars.set(name,val); }
  set(name,val){ this.vars.set(name,val); }
}

/* ------------------------- ВЫПОЛНЕНИЕ ------------------------- */
const RETURN=new function ReturnSig(){}, BREAK={}, CONTINUE={};

function runProgram(ast, ctx){
  const globalEnv=new Env(null);
  installBuiltins(globalEnv, ctx);
  pyExecBlock(ast.body, globalEnv, ctx);
  return globalEnv;
}

function pyExecBlock(stmts, env, ctx){
  for(const s of stmts) pyExec(s, env, ctx);
}
function pyExec(node, env, ctx){
  switch(node.type){
    case 'ExprStmt': pyEval(node.expr, env, ctx); return;
    case 'Pass': return;
    case 'Assign': {
      const value=pyEval(node.value, env, ctx);
      for(const t of node.targets) assignTarget(t, value, env, ctx);
      return;
    }
    case 'AugAssign': {
      const cur=targetValue(node.target, env, ctx);
      const rhs=pyEval(node.value, env, ctx);
      const res=binop(node.op, cur, rhs);
      assignTarget(node.target, res, env, ctx);
      return;
    }
    case 'If': {
      if(pyTruthy(pyEval(node.test, env, ctx))) pyExecBlock(node.body, env, ctx);
      else if(node.orelse) pyExecBlock(node.orelse, env, ctx);
      return;
    }
    case 'While': {
      let guard=0;
      while(pyTruthy(pyEval(node.test, env, ctx))){
        try{ pyExecBlock(node.body, env, ctx); }
        catch(e){ if(e===BREAK) break; if(e===CONTINUE) continue; throw e; }
        if(++guard>1000000) throw PyError('RuntimeError: возможен бесконечный цикл (превышен лимит итераций)');
      }

    }
    case 'For': {
      const it=iterableOf(pyEval(node.iter, env, ctx));
      for(const item of it){
        assignTarget(node.target, item, env, ctx);
        try{ pyExecBlock(node.body, env, ctx); }

    }
    case 'FunctionDef': {
      const f=new PyFunc(node.name, node.params, node.vararg, node.kwarg, node.body, env, false);
      env.setLocal(node.name, f);
      return;
    }
    case 'Return': {
      const v = node.value?pyEval(node.value, env, ctx):null;
      throw {__ret:true, value:v};
    }
    case 'Break': throw BREAK;
    case 'Continue': throw CONTINUE;

      env.setLocal(node.name, new PyClass(node.name, bases, methods));

function fmtErr(e){
  if(e && e.isPy) return e.pyMsg;
  if(e && e.__ret) return 'SyntaxError: return outside function';
  if(e && e.message) return e.message;
  return String(e);
}
function stubCtx(){ return { out:function(){}, inputQueue:[], allowPrompt:false }; }
function runPython(src, opts){
  opts=opts||{};
  const buf=[];
  const ctx={
    out:function(t){ buf.push(t); if(buf.join('').length>500000) throw PyError('RuntimeError: слишком большой объём вывода (возможен бесконечный цикл)'); },
    inputQueue:(opts.inputs||[]).slice(),
    allowPrompt: opts.allowPrompt!==false
  };
  let ast, env;
  try{
    const toks=tokenize(src);
    ast=new Parser(toks).parseProgram();
  }catch(e){ return {output:'', error:fmtErr(e), env:null, phase:'parse'}; }
  try{ env=runProgram(ast, ctx); }
  catch(e){
    if(e && e.__ret){ /* top-level return — игнорируем */ }
    else return {output:buf.join(''), error:fmtErr(e), env:null, phase:'run'};
  }
  return {output:buf.join(''), error:null, env:env, phase:'ok'};
}
function normOut(s){
  return String(s==null?'':s).replace(/\r\n?/g,'\n').split('\n').map(l=>l.replace(/[ \t]+$/,'')).join('\n').replace(/\n+$/,'');
}
function pyValFromJS(v){
  if(v===null||v===undefined) return null;
  if(Array.isArray(v)) return v.map(pyValFromJS);
  if(typeof v==='object'){ const d=new PyDict(); for(const k in v) d.set(k, pyValFromJS(v[k])); return d; }
  return v;
}
function evalChecks(lesson, src){
  const checks=(lesson.task && lesson.task.checks) || [];
  const results=[];
  for(const c of checks){
    if(c.type==='code'){
      const re=new RegExp(c.regex, c.flags||'');
      const okAll=re.test(src);
      const ok = c.negate ? !okAll : okAll;
      results.push({ok:ok, label:c.label||'Проверка кода', detail: ok?'':(c.hint||'Код не соответствует требованию задания.')});
      continue;
    }
    const r=runPython(src, {inputs:c.inputs||[], allowPrompt:false});
    if(c.type==='output'){
      const got=normOut(r.output), exp=normOut(c.expected);
      let ok = got===exp && !r.error;
      let detail='';
      if(!ok){ detail = r.error ? ('Ошибка выполнения:\n'+r.error) : ('Ожидалось:\n'+(exp||'(пусто)')+'\n\nПолучено:\n'+(got||'(пусто)')); }
      results.push({ok:ok, label:c.label||'Вывод программы', detail:detail});
    } else if(c.type==='var'){
      if(r.error){ results.push({ok:false, label:c.label||('Переменная '+c.name), detail:'Ошибка выполнения:\n'+r.error}); continue; }
      if(!r.env || !r.env.vars.has(c.name)){ results.push({ok:false, label:c.label||('Переменная '+c.name), detail:'Переменная '+c.name+' не найдена.'}); continue; }
      const actual=pyRepr(r.env.vars.get(c.name));
      const ok=actual===c.expected;
      results.push({ok:ok, label:c.label||('Переменная '+c.name), detail: ok?'':('Ожидалось: '+c.name+' = '+c.expected+'\nПолучено: '+c.name+' = '+actual)});
    } else if(c.type==='func'){
      if(r.error){ results.push({ok:false, label:c.label||('Функция '+c.name), detail:'Ошибка выполнения:\n'+r.error}); continue; }
      if(!r.env || !r.env.vars.has(c.name)){ results.push({ok:false, label:c.label||('Функция '+c.name), detail:'Функция '+c.name+' не найдена.'}); continue; }
      const fn=r.env.vars.get(c.name);
      let actual, err=null;
      try{ actual=pyRepr(callValue(fn, (c.args||[]).map(pyValFromJS), {}, stubCtx())); }catch(e){ err=fmtErr(e); }
      const ok = !err && actual===c.expected;
      results.push({ok:ok, label:c.label||('Функция '+c.name), detail: ok?'':(err?('Ошибка вызова: '+err):('Ожидалось: '+c.name+'('+(c.args||[]).join(', ')+') → '+c.expected+'\nПолучено: '+actual))});
    }
  }
  return results;
}

]},

{ id:'m11', icon:'🏛️', title:'Модуль 11. Классы и ООП', lessons:[
  { id:'m11l1', title:'11.1. Классы и объекты',

/* =========================================================================
   4. ПОДСВЕТКА СИНТАКСИСА
   ========================================================================= */
function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>'); }
function highlightPython(src){
  const kwSet=new Set(['if','elif','else','for','while','def','return','break','continue','pass','and','or','not','in','is','import','from','as','class','try','except','finally','raise','lambda','global','nonlocal','with','del','assert','yield','True','False','None']);
  const twoOps=['==','!=','<=','>=','//','**','+=','-=','*=','/=','->',':='];
  let out=''; let i=0; const n=src.length;
  const sp=(cls,txt)=>'<span class="tok-'+cls+'">'+escHtml(txt)+'</span>';
  while(i<n){
    const c=src[i];
    if(c==='#'){ let j=i; while(j<n&&src[j]!=='\n')j++; out+=sp('com',src.slice(i,j)); i=j; continue; }
    let pi=i, pre='';
    if(/[fFrRbBuU]/.test(c)){ let k=i; while(k<n&&/[fFrRbBuU]/.test(src[k])&&k-i<2)k++; if(k<n&&(src[k]==='"'||src[k]==="'")){ pre=src.slice(i,k); pi=k; } }
    if(src[pi]==='"'||src[pi]==="'"){
      const q=src[pi]; let triple=false; let j=pi;
      if(src[j+1]===q&&src[j+2]===q){ triple=true; j+=3; } else j+=1;
      while(j<n){ if(triple){ if(src[j]===q&&src[j+1]===q&&src[j+2]===q){ j+=3; break; } } else if(src[j]===q){ j+=1; break; }
        if(src[j]==='\\'){ j+=2; continue; } j++; }
      out+=sp('str',src.slice(i,Math.min(j,n))); i=Math.min(j,n); continue;
    }
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(src[i+1]||''))){
      let j=i;
      if(c==='0'&&/[xXoObB]/.test(src[i+1]||'')){ j=i+2; while(j<n&&/[0-9a-fA-F_]/.test(src[j]))j++; }
      else { while(j<n&&/[0-9_]/.test(src[j]))j++; if(src[j]==='.'){ j++; while(j<n&&/[0-9_]/.test(src[j]))j++; } if(/[eE]/.test(src[j]||'')){ let m=j+1; if(src[m]==='+'||src[m]==='-')m++; if(/[0-9]/.test(src[m]||'')){ j=m; while(j<n&&/[0-9]/.test(src[j]))j++; } } }
      out+=sp('num',src.slice(i,j)); i=j; continue;
    }
    if(/[A-Za-z_]/.test(c)){ let j=i; while(j<n&&/[A-Za-z0-9_]/.test(src[j]))j++; const w=src.slice(i,j);
      if(kwSet.has(w)) out+=sp('kw',w); else if(BUILTIN_NAMES.has(w)) out+=sp('bi',w); else out+=escHtml(w); i=j; continue; }
    if('+-*/%<>=()[]{}.,:;'.includes(c)){
      const two=src.substr(i,2);
      if(twoOps.indexOf(two)>=0){ out+=escHtml(two); i+=2; } else { out+=escHtml(c); i++; }
      continue;
    }
    out+=escHtml(c); i++;
  }
  return out;
}

/* =========================================================================
   5. ХРАНИЛИЩЕ И СОСТОЯНИЕ
   ========================================================================= */
const PROGRESS_KEY='pycamp.progress.v1';
const CODE_KEY='pycamp.code.v1';
let progress={}; let codeStore={};
try{ progress=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}')||{}; }catch(e){ progress={}; }
try{ codeStore=JSON.parse(localStorage.getItem(CODE_KEY)||'{}')||{}; }catch(e){ codeStore={}; }
function saveProgress(){ try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); }catch(e){} }
function saveCode(){ try{ localStorage.setItem(CODE_KEY, JSON.stringify(codeStore)); }catch(e){} }

const LESSONS=[];
COURSE.forEach(function(m){ m.lessons.forEach(function(l){ LESSONS.push({module:m, lesson:l}); }); });
let activeId=null;
function findEntry(id){ for(let k=0;k<LESSONS.length;k++) if(LESSONS[k].lesson.id===id) return LESSONS[k]; return null; }

/* =========================================================================
   6. ЭЛЕМЕНТЫ DOM
   ========================================================================= */
const mainEl=document.getElementById('main');
const navEl=document.getElementById('courseTree');
const codeEl=document.getElementById('code');
const highlightEl=document.getElementById('highlight');
const gutterEl=document.getElementById('gutter');
const consoleEl=document.getElementById('console');
const resultsEl=document.getElementById('results');
const sidebarEl=document.getElementById('sidebar');

/* =========================================================================
   7. ДЕРЕВО КУРСА
   ========================================================================= */
function renderTree(){
  navEl.innerHTML='';
  COURSE.forEach(function(m, mi){
    const wrap=document.createElement('div'); wrap.className='module';
    const doneCount=m.lessons.filter(function(l){ return progress[l.id]; }).length;
    const head=document.createElement('div'); head.className='module-head';
    const countHtml = doneCount===m.lessons.length
      ? '<span class="module-count" style="background:#00471b;color:#7bed9f">'+doneCount+'/'+m.lessons.length+' ✓</span>'
      : '<span class="module-count">'+doneCount+'/'+m.lessons.length+'</span>';
    head.innerHTML='<span class="module-icon">'+m.icon+'</span><span style="flex:1">'+escHtml(m.title)+'</span>'+countHtml+'<span class="chev">▶</span>';
    const list=document.createElement('div'); list.className='lessons';
    m.lessons.forEach(function(l){
      const a=document.createElement('div');
      a.className='lesson-link'+(progress[l.id]?' done':'')+(l.id===activeId?' active':'');
      a.innerHTML='<span class="check">'+(progress[l.id]?'✓':'')+'</span><span>'+escHtml(l.title)+'</span>';
      a.onclick=function(){ openLesson(l.id); closeSidebar(); };
      list.appendChild(a);
    });
    head.onclick=function(){ wrap.classList.toggle('open'); };
    wrap.appendChild(head); wrap.appendChild(list);
    navEl.appendChild(wrap);
    if(activeId && m.lessons.some(function(l){ return l.id===activeId; })) wrap.classList.add('open');
    else if(!activeId && mi===0) wrap.classList.add('open');
  });
}

/* =========================================================================
   8. ОТКРЫТИЕ УРОКА
   ========================================================================= */
function openLesson(id){
  const entry=findEntry(id); if(!entry) return;
  activeId=id;
  const l=entry.lesson;
  document.getElementById('crumbs').textContent=entry.module.title;
  document.getElementById('lessonTitle').innerHTML=escHtml(l.title)+(progress[id]?'<span class="badge">✔ изучено</span>':'');
  document.getElementById('theoryPane').innerHTML=l.theory;
  document.getElementById('taskTitle').innerHTML='✏️ Задание';
  document.getElementById('taskPane').innerHTML=l.task.text;
  const hintBox=document.getElementById('hintBox');
  hintBox.innerHTML='💡 '+(l.task.hint||'Подсказка недоступна.');
  hintBox.classList.remove('show');
  const solBox=document.getElementById('solutionBox');
  solBox.innerHTML='<div style="font-weight:600;color:var(--muted);margin-bottom:6px">Пример решения:</div><pre><code>'+escHtml(l.task.solution||'')+'</code></pre>';
  solBox.classList.remove('show');
  codeEl.value = (id in codeStore) ? codeStore[id] : (l.starter||'');
  syncEditor();
  consoleEl.innerHTML='<span class="lbl">Нажмите «Запустить» или «Проверить»…</span>';
  resultsEl.style.display='none'; resultsEl.innerHTML='';
  renderTree();
  mainEl.scrollTop=0;
}

/* =========================================================================
   9. РЕДАКТОР
   ========================================================================= */
function syncEditor(){
  const val=codeEl.value;
  highlightEl.innerHTML=highlightPython(val)+'\n';
  const lines=val.split('\n').length;
  let g=''; for(let i=1;i<=Math.max(lines,1);i++) g+=i+'\n';
  gutterEl.textContent=g;
  highlightEl.scrollTop=codeEl.scrollTop;
  highlightEl.scrollLeft=codeEl.scrollLeft;
  gutterEl.scrollTop=codeEl.scrollTop;
}
codeEl.addEventListener('input', function(){
  if(activeId!==null){ codeStore[activeId]=codeEl.value; saveCode(); }
  syncEditor();
});
codeEl.addEventListener('scroll', function(){
  highlightEl.scrollTop=codeEl.scrollTop;
  highlightEl.scrollLeft=codeEl.scrollLeft;
  gutterEl.scrollTop=codeEl.scrollTop;
});
codeEl.addEventListener('keydown', function(e){
  if(e.key==='Tab'){
    e.preventDefault();
    const s=codeEl.selectionStart, en=codeEl.selectionEnd;
    codeEl.value=codeEl.value.slice(0,s)+'    '+codeEl.value.slice(en);
    codeEl.selectionStart=codeEl.selectionEnd=s+4;
    if(activeId!==null){ codeStore[activeId]=codeEl.value; saveCode(); }
    syncEditor();
  } else if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){
    e.preventDefault(); runCode();
  }
});

/* =========================================================================
   10. ЗАПУСК И ПРОВЕРКА
   ========================================================================= */
function showConsole(res){
  consoleEl.innerHTML='';
  if(res.output){ const t=document.createElement('span'); t.textContent=res.output; consoleEl.appendChild(t); }
  if(res.error){ const d=document.createElement('div'); d.className='err'; d.textContent=(res.output?'\n':'')+'⚠ '+res.error; consoleEl.appendChild(d); }
  if(!res.output && !res.error) consoleEl.innerHTML='<span class="lbl">Программа завершилась без вывода.</span>';
}
function runCode(){
  if(activeId===null) return;
  const res=runPython(codeEl.value, {inputs:[], allowPrompt:true});
  showConsole(res);
  resultsEl.style.display='none';
}
function checkCode(){
  if(activeId===null) return;
  const entry=findEntry(activeId);
  const src=codeEl.value;
  const results=evalChecks(entry.lesson, src);
  // показываем вывод программы в консоли первого output-теста
  const outCheck=entry.lesson.task.checks.filter(function(c){ return c.type==='output'; })[0];
  showConsole(runPython(src, {inputs:(outCheck&&outCheck.inputs)||[], allowPrompt:true}));

  resultsEl.innerHTML='';
  let allPass = results.length>0;
  results.forEach(function(r){
    if(!r.ok) allPass=false;
    const row=document.createElement('div'); row.className='result-row '+(r.ok?'pass':'fail');
    row.innerHTML='<span class="ico">'+(r.ok?'✓':'✗')+'</span><div style="flex:1"><div>'+escHtml(r.label)+'</div>'+(r.detail?'<div class="detail">'+escHtml(r.detail)+'</div>':'')+'</div>';
    resultsEl.appendChild(row);
  });
  const banner=document.createElement('div'); banner.className='banner '+(allPass?'ok':'no');
  banner.textContent= allPass ? '🎉 Отлично! Задание выполнено.' : 'Пока не всё верно — посмотрите разбор ниже.';
  resultsEl.insertBefore(banner, resultsEl.firstChild);
  resultsEl.style.display='block';

  if(allPass){
    progress[activeId]=true; saveProgress(); updateProgressBar();
    document.getElementById('lessonTitle').innerHTML=escHtml(entry.lesson.title)+'<span class="badge">✔ изучено</span>';
    renderTree();
  }
}
function updateProgressBar(){
  const total=LESSONS.length;
  const done=LESSONS.filter(function(e){ return progress[e.lesson.id]; }).length;
  const pct= total? Math.round(done/total*100) : 0;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressText').textContent=done+' / '+total;
}

/* =========================================================================
   11. КНОПКИ И НАВИГАЦИЯ
   ========================================================================= */
function closeSidebar(){ if(window.innerWidth<=820) sidebarEl.classList.remove('open'); }
document.getElementById('menuBtn').onclick=function(){ sidebarEl.classList.toggle('open'); };
document.getElementById('runBtn').onclick=runCode;
document.getElementById('checkBtn').onclick=checkCode;
document.getElementById('hintBtn').onclick=function(){ document.getElementById('hintBox').classList.toggle('show'); };
document.getElementById('solutionBtn').onclick=function(){ document.getElementById('solutionBox').classList.toggle('show'); };
document.getElementById('resetCodeBtn').onclick=function(){
  const entry=findEntry(activeId); if(!entry) return;
  codeEl.value=entry.lesson.starter||'';
  codeStore[activeId]=codeEl.value; saveCode(); syncEditor();
  consoleEl.innerHTML='<span class="lbl">Код сброшен к исходному.</span>';
  resultsEl.style.display='none';
};
document.getElementById('resetBtn').onclick=function(){
  if(!window.confirm('Сбросить весь прогресс и написанный код?')) return;
  progress={}; codeStore={}; saveProgress(); saveCode();
  updateProgressBar(); openLesson(LESSONS[0].lesson.id);
};

/* =========================================================================
   12. СТАРТ
   ========================================================================= */
openLesson(LESSONS[0].lesson.id);
updateProgressBar();
renderTree();
console.log('PyCamp готов. Уроков:', LESSONS.length);
</script>
</body>
</html>
