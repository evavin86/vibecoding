    function renderMarkdown(md) {
      return md
        .replace(/```python\n([\s\S]*?)```/g, '<pre class="code-block"><code>$1</code></pre>')
        .replace(/```\n([\s\S]*?)```/g, '<pre class="code-block"><code>$1</code></pre>')
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<span class="inline-code">$1</span>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/\|(.+)\|/g, (m) => {
          const cells = m.split('|').filter(c => c.trim());
          if (cells.every(c => /^[-\s]+$/.test(c))) return '';
          return '<div style="display:flex;gap:16px;padding:4px 0;border-bottom:1px solid var(--border)">' +
            cells.map(c => `<span style="font-size:13px;color:var(--text-secondary)">${c.trim()}</span>`).join('') + '</div>';
        });
    }

    function App() {
      const [currentSection, setCurrentSection] = useState(0);
      const [currentLesson, setCurrentLesson] = useState(0);
      const [code, setCode] = useState('');
      const [output, setOutput] = useState('');
      const [isRunning, setIsRunning] = useState(false);
      const [completedLessons, setCompletedLessons] = useState(() => {
        try { return JSON.parse(localStorage.getItem('pcc_progress') || '[]'); } catch { return []; }
      });
      const [showSidebar, setShowSidebar] = useState(true);
      const [showHint, setShowHint] = useState(false);
      const [testResults, setTestResults] = useState([]);
      const [showCert, setShowCert] = useState(false);
      const [pyodide, setPyodide] = useState(null);
      const [loading, setLoading] = useState(true);
      const [userName, setUserName] = useState(() => localStorage.getItem('pcc_name') || '');
      const [showProfile, setShowProfile] = useState(false);
      const [expanded, setExpanded] = useState(new Set([0]));
      const codeRef = useRef(null);

      useEffect(() => { localStorage.setItem('pcc_progress', JSON.stringify(completedLessons)); }, [completedLessons]);

      useEffect(() => {
        (async () => {
          try { const py = await window.loadPyodide(); setPyodide(py); } catch (e) { console.error(e); }
          setLoading(false);
        })();
      }, []);

      useEffect(() => {
        const lesson = courseData[currentSection]?.lessons[currentLesson];
        if (lesson) { setCode(lesson.initialCode); setOutput(''); setTestResults([]); setShowHint(false); }
      }, [currentSection, currentLesson]);

      const total = courseData.reduce((a, s) => a + s.lessons.length, 0);
      const progress = Math.round((completedLessons.length / total) * 100);

      const runCode = useCallback(async () => {
        if (!pyodide) { setOutput('Загрузка Python...'); return; }
        setIsRunning(true); setOutput(''); setTestResults([]);
        try {
          pyodide.runPython(`import sys\nfrom io import StringIO\nsys.stdout = StringIO()\nsys.stderr = StringIO()`);
          await pyodide.runPythonAsync(code);
          const stdout = pyodide.runPython('sys.stdout.getvalue()');
          const stderr = pyodide.runPython('sys.stderr.getvalue()');
          setOutput(stdout + (stderr ? '\n' + stderr : '') || '(нет вывода)');
          const lesson = courseData[currentSection].lessons[currentLesson];
          const results = lesson.tests.map(t => {
            try { return { text: t.text, passed: new Function('output', 'code', `return ${t.testFn}`)(stdout, code) }; }
            catch { return { text: t.text, passed: false }; }
          });
          setTestResults(results);
          if (results.every(r => r.passed) && !completedLessons.includes(lesson.id)) {
            setCompletedLessons(p => [...p, lesson.id]);
          }
        } catch (e) { setOutput(`Ошибка: ${e.message}`); }
        setIsRunning(false);
      }, [pyodide, code, currentSection, currentLesson, completedLessons]);

      const toggle = (i) => setExpanded(p => { const n = new Set(p); n.has(i) ? n.delete(i) : n.add(i); return n; });
      const go = (s, l) => { setCurrentSection(s); setCurrentLesson(l); if (window.innerWidth < 1024) setShowSidebar(false); };
      const next = () => {
        const sec = courseData[currentSection];
        if (currentLesson < sec.lessons.length - 1) setCurrentLesson(currentLesson + 1);
        else if (currentSection < courseData.length - 1) { setCurrentSection(currentSection + 1); setCurrentLesson(0); }
      };
      const prev = () => {
        if (currentLesson > 0) setCurrentLesson(currentLesson - 1);
        else if (currentSection > 0) { setCurrentSection(currentSection - 1); setCurrentLesson(courseData[currentSection - 1].lessons.length - 1); }
      };

      const lesson = courseData[currentSection]?.lessons[currentLesson];
      const done = lesson && completedLessons.includes(lesson.id);
      const allDone = completedLessons.length === total;

      return (
        <div style={{height: '100vh', display: 'flex', flexDirection: 'column'}}>
          {/* Header */}
          <header style={{height: 52, borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 16px', background: 'var(--bg-secondary)'}}>
            <div style={{display: 'flex', alignItems: 'center', gap: 12}}>
              <button onClick={() => setShowSidebar(!showSidebar)} className="btn-ghost" style={{display: 'none'}} id="menuBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
              </button>
              <div style={{display: 'flex', alignItems: 'center', gap: 8}}>

                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                </div>
                <span style={{fontSize: 14, fontWeight: 600}}>PyCodeCamp</span>
              </div>
            </div>
            <div style={{display: 'flex', alignItems: 'center', gap: 12}}>
              <div style={{display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, color: 'var(--text-secondary)'}}>
                <span>{completedLessons.length}/{total}</span>
                <div className="progress-bar" style={{width: 80}}>
                  <div className="progress-fill" style={{width: `${progress}%`}}></div>
                </div>
                <span style={{color: 'var(--accent)'}}>{progress}%</span>
              </div>
              <button onClick={() => setShowProfile(true)} style={{width: 28, height: 28, borderRadius: 6, background: 'var(--bg-tertiary)', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 600, color: 'var(--text-primary)'}}>
                {userName ? userName[0].toUpperCase() : '?'}
              </button>
            </div>
          </header>

          {/* Profile Modal */}
          {showProfile && (
            <div className="modal-overlay" onClick={() => setShowProfile(false)}>

                <h2 style={{fontSize: 18, fontWeight: 600, marginBottom: 16}}>Профиль</h2>
                <div style={{marginBottom: 16}}>
                  <label style={{display: 'block', fontSize: 12, color: 'var(--text-secondary)', marginBottom: 6}}>Имя</label>
                  <input type="text" value={userName} onChange={e => { setUserName(e.target.value); localStorage.setItem('pcc_name', e.target.value); }}
                    style={{width: '100%', padding: '8px 12px', background: 'var(--bg-primary)', border: '1px solid var(--border)', borderRadius: 6, color: 'var(--text-primary)', fontSize: 13, outline: 'none'}}
                    placeholder="Введите имя" />
                </div>
                <div style={{marginBottom: 16}}>
                  <div style={{fontSize: 12, color: 'var(--text-secondary)', marginBottom: 4}}>Прогресс</div>
                  <div style={{fontSize: 24, fontWeight: 600, color: 'var(--accent)'}}>{progress}%</div>
                  <div style={{fontSize: 12, color: 'var(--text-muted)'}}>{completedLessons.length} из {total} уроков</div>
                  <div className="progress-bar" style={{marginTop: 8}}>
                    <div className="progress-fill" style={{width: `${progress}%`}}></div>
                  </div>
                </div>
                {allDone && (
                  <button onClick={() => { setShowCert(true); setShowProfile(false); }} className="btn btn-primary" style={{width: '100%', justifyContent: 'center', marginBottom: 8}}>
                    Получить сертификат
                  </button>
                )}
                <button onClick={() => setShowProfile(false)} className="btn btn-secondary" style={{width: '100%', justifyContent: 'center'}}>Закрыть</button>
              </div>
            </div>
          )}

          {/* Certificate */}
          {showCert && (
            <div className="modal-overlay" onClick={() => setShowCert(false)}>
              <div className="modal fade-in" onClick={e => e.stopPropagation()} style={{padding: 32, textAlign: 'center'}}>
                <div style={{fontSize: 48, marginBottom: 16}}>🎓</div>
                <h2 style={{fontSize: 24, fontWeight: 600, marginBottom: 8}}>Сертификат</h2>
                <p style={{color: 'var(--text-secondary)', marginBottom: 24}}>о прохождении курса</p>
                <div style={{background: 'var(--bg-primary)', borderRadius: 8, padding: 24, marginBottom: 24}}>
                  <p style={{color: 'var(--text-secondary)', fontSize: 14}}>Настоящий сертификат подтверждает, что</p>

                </div>

                        {showHint ? 'Скрыть подсказку' : 'Показать подсказку'}
                      </button>
                      {showHint && (
                        <div style={{marginTop: 8, padding: 12, background: 'rgba(88, 166, 255, 0.08)', border: '1px solid rgba(88, 166, 255, 0.2)', borderRadius: 6, fontSize: 13, color: 'var(--accent)'}}>
                          {lesson.hint}

                    {testResults.length > 0 && (
                      <div className="card fade-in" style={{padding: 16, marginBottom: 16}}>
                        <div style={{fontSize: 12, fontWeight: 600, color: 'var(--text-muted)', textTransform: 'uppercase', marginBottom: 12}}>Результаты</div>
                        {testResults.map((r, i) => (
                          <div key={i} style={{display: 'flex', alignItems: 'center', gap: 8, padding: '4px 0', fontSize: 13, color: r.passed ? 'var(--success)' : 'var(--error)'}}>
                            {r.passed ? (
                              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                            ) : (
                              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                            )}
                            <span>{r.text}</span>
                          </div>
                        ))}
                        {testResults.every(r => r.passed) && (
                          <div style={{marginTop: 12, paddingTop: 12, borderTop: '1px solid var(--border)', fontSize: 13, fontWeight: 600, color: 'var(--success)', display: 'flex', alignItems: 'center', gap: 8}}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            Все тесты пройдены
                          </div>
                        )}
                      </div>
                    )}
                    <div style={{display: 'flex', justifyContent: 'space-between', paddingTop: 16, borderTop: '1px solid var(--border)'}}>
                      <button onClick={prev} disabled={currentSection === 0 && currentLesson === 0} className="btn btn-secondary" style={{opacity: currentSection === 0 && currentLesson === 0 ? 0.3 : 1}}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg>
                        Назад
                      </button>
                      <button onClick={next} disabled={currentSection === courseData.length - 1 && currentLesson === courseData[currentSection].lessons.length - 1} className="btn btn-primary" style={{opacity: currentSection === courseData.length - 1 && currentLesson === courseData[currentSection].lessons.length - 1 ? 0.3 : 1}}>
                        Далее
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>
                      </button>
                    </div>
                  </div>
                )}
              </div>

              {/* Editor */}
              <div style={{width: 440, borderLeft: '1px solid var(--border)', display: 'flex', flexDirection: 'column', background: 'var(--bg-secondary)'}}>
                <div style={{padding: '8px 16px', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: 'var(--bg-primary)'}}>
                  <div style={{display: 'flex', alignItems: 'center', gap: 8}}>
                    <div style={{display: 'flex', gap: 6}}>
                      <div style={{width: 10, height: 10, borderRadius: '50%', background: '#f85149'}}></div>
                      <div style={{width: 10, height: 10, borderRadius: '50%', background: '#d29922'}}></div>
                      <div style={{width: 10, height: 10, borderRadius: '50%', background: '#3fb950'}}></div>
                    </div>
                    <span style={{fontSize: 12, color: 'var(--text-muted)', fontFamily: 'JetBrains Mono, monospace'}}>editor.py</span>
                  </div>
                  <div style={{fontSize: 11, display: 'flex', alignItems: 'center', gap: 4}}>
                    {loading && <><span className="pulse" style={{width: 6, height: 6, borderRadius: '50%', background: 'var(--warning)'}}></span><span style={{color: 'var(--warning)'}}>Загрузка...</span></>}
                    {!loading && pyodide && <><span style={{width: 6, height: 6, borderRadius: '50%', background: 'var(--success)'}}></span><span style={{color: 'var(--success)'}}>Готов</span></>}
                  </div>
                </div>
                <div style={{flex: 1, overflow: 'hidden'}}>
                  <textarea ref={codeRef} value={code} onChange={e => setCode(e.target.value)}
                    style={{width: '100%', height: '100%', background: 'var(--bg-primary)', color: '#7ee787', padding: 16, border: 'none', resize: 'none', fontSize: 13, lineHeight: 1.6, outline: 'none'}}
                    spellCheck={false} placeholder="# Код на Python..."
                    onKeyDown={e => {
                      if (e.key === 'Tab') {
                        e.preventDefault();
                        const s = e.currentTarget.selectionStart, end = e.currentTarget.selectionEnd;
                        setCode(code.substring(0, s) + '    ' + code.substring(end));
                        setTimeout(() => { if (codeRef.current) codeRef.current.selectionStart = codeRef.current.selectionEnd = s + 4; }, 0);
                      }
                      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runCode(); }
                    }} />
                </div>
                <div style={{borderTop: '1px solid var(--border)', padding: 12}}>
                  <div style={{display: 'flex', gap: 8, marginBottom: output ? 12 : 0}}>
                    <button onClick={runCode} disabled={isRunning || loading} className="btn btn-primary" style={{flex: 1, justifyContent: 'center', opacity: isRunning || loading ? 0.5 : 1}}>
                      {isRunning ? 'Выполняется...' : 'Запустить'}
                    </button>
                    <button onClick={() => { setCode(lesson?.initialCode || ''); setOutput(''); setTestResults([]); }} className="btn btn-secondary">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                    </button>
                  </div>
                  {output && (
                    <div style={{background: 'var(--bg-primary)', border: '1px solid var(--border)', borderRadius: 6, padding: 12, maxHeight: 120, overflowY: 'auto'}}>
                      <div style={{fontSize: 11, color: 'var(--text-muted)', marginBottom: 4}}>Вывод</div>
                      <pre className="mono" style={{fontSize: 12, color: 'var(--text-primary)', whiteSpace: 'pre-wrap'}}>{output}</pre>
                    </div>
                  )}
                </div>
              </div>
            </main>
          </div>

          <style>{`
            @media (max-width: 1024px) {
              #menuBtn { display: flex !important; }
              aside { position: fixed !important; left: 0; top: 52px; bottom: 0; z-index: 40; }
            }
          `}</style>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
