<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Навигация учебного модуля</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html, body { background-color: #030712; } /* bg-gray-950 */
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    /**
     * Компонент навигации для учебного модуля.
     * @param {Object} props
     * @param {number} props.current - индекс текущего урока (с 0)
     * @param {number} props.total   - общее количество уроков
     * @param {Function} props.onPrev - обработчик "Назад"
     * @param {Function} props.onNext - обработчик "Далее"
     * @param {Function} props.onModules - обработчик "К модулям"
     */
    function ModuleNavigation({ current, total, onPrev, onNext, onModules }) {
      const isFirst = current <= 0;
      const isLast  = current >= total - 1;

      // Базовые классы для всех кнопок
      const baseBtn =
        "px-5 py-2.5 rounded-lg font-medium text-sm sm:text-base " +
        "transition-colors duration-200 focus:outline-none focus:ring-2 " +
        "focus:ring-offset-2 focus:ring-offset-gray-950";

      // Классы для активной/неактивной кнопки "Назад"
      const prevBtnClasses = isFirst
        ? baseBtn + " bg-gray-800 text-gray-500 cursor-not-allowed"
        : baseBtn + " bg-gray-800 text-gray-100 hover:bg-gray-700 focus:ring-gray-500";

      // Классы для активной/неактивной кнопки "Далее"
      const nextBtnClasses = isLast
        ? baseBtn + " bg-gray-800 text-gray-500 cursor-not-allowed"
        : baseBtn + " bg-indigo-600 text-white hover:bg-indigo-500 focus:ring-indigo-400";

      // Классы для кнопки "К модулям"
      const modulesBtnClasses =
        baseBtn +
        " bg-transparent text-gray-300 hover:text-white hover:bg-gray-800 focus:ring-gray-500 border border-gray-700";

      return (
        <nav
          className="w-full max-w-3xl mx-auto mt-8 p-4 sm:p-6 rounded-2xl bg-gray-900/70 border border-gray-800 shadow-lg"
          aria-label="Навигация по урокам"
        >
          {/* Информация о прогрессе */}
          <div className="mb-4 flex items-center justify-between">
            <span className="text-sm text-gray-400">
              Урок {current + 1} из {total}
            </span>
            <div className="flex-1 mx-4 h-1.5 bg-gray-800 rounded-full overflow-hidden">
              <div
                className="h-full bg-indigo-500 transition-all duration-300"
                style={{ width: `${((current + 1) / total) * 100}%` }}
              />
            </div>
          </div>

          {/* Кнопки навигации */}
          <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
            <button
              type="button"
              className={prevBtnClasses}
              disabled={isFirst}
              onClick={onPrev}
              aria-disabled={isFirst}
            >
              ← Назад
            </button>

            <button
              type="button"
              className={modulesBtnClasses}
              onClick={onModules}
            >
              К модулям
            </button>

            <button
              type="button"
              className={nextBtnClasses}
              disabled={isLast}
              onClick={onNext}
              aria-disabled={isLast}
            >
              Далее →
            </button>
          </div>
        </nav>
      );
    }

    /**
     * Демонстрационное приложение, использующее компонент навигации.
     * Содержит 5 уроков, по которым можно перемещаться.
     */
    function App() {
      const lessons = [
        { title: "Введение в React",       desc: "Что такое React и зачем он нужен. JSX, компоненты, виртуальный DOM." },
        { title: "Компоненты и props",      desc: "Функциональные компоненты, передача данных через props." },
        { title: "Состояление и хуки",      desc: "useState, useEffect и другие базовые хуки React." },
        { title: "Обработка событий",      desc: "События в React, обработчики, передача аргументов." },
        { title: "Сборка и деплой",         desc: "Vite, сборка проекта и публикация на хостинг." },
      ];

      const [current, setCurrent] = useState(0);
      const total = lessons.length;

      const handlePrev   = () => setCurrent(c => Math.max(0, c - 1));
      const handleNext   = () => setCurrent(c => Math.min(total - 1, c + 1));
      const handleModules = () => {
        alert("Возврат к списку модулей (демонстрационное действие).");
      };

      const lesson = lessons[current];

      return (
        <main className="min-h-screen flex flex-col items-center justify-center px-4 py-10">
          <div className="w-full max-w-3xl">
            {/* Карточка урока */}
            <article className="p-6 sm:p-8 rounded-2xl bg-gray-900/70 border border-gray-800 shadow-lg">
              <p className="text-xs uppercase tracking-widest text-indigo-400 mb-2">
                Модуль · Урок {current + 1}
              </p>
              <h1 className="text-2xl sm:text-3xl font-bold text-white mb-4">
                {lesson.title}
              </h1>
              <p className="text-gray-300 leading-relaxed">
                {lesson.desc}
              </p>
            </article>

            {/* Навигация */}
            <ModuleNavigation
              current={current}
              total={total}
              onPrev={handlePrev}
              onNext={handleNext}
              onModules={handleModules}
            />
          </div>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
