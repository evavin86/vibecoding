<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>PyCamp — учи Python бесплатно, прямо в браузере</title>
<meta name="description" content="Интерактивная платформа изучения Python в стиле freeCodeCamp: 79 уроков, настоящий Python в браузере (WebAssembly), автопроверка тестами и сертификаты.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23ffc300'/%3E%3Ctext%20x='32'%20y='44'%20font-size='30'%20font-family='monospace'%20font-weight='bold'%20text-anchor='middle'%20fill='%230a0a23'%3EPy%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0a23; --surface:#1b1b32; --surface-2:#2a2a40; --surface-3:#14142b;
  --border:#3b3b4f; --text:#f5f6f7; --muted:#d0d0d5; --dim:#8f8fa3;
  --accent:#ffc300; --accent-soft:rgba(255,195,0,.14);
  --blue:#198eee; --green:#acd157; --red:#f82153; --purple:#d2a8ff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;min-height:100vh}
::selection{background:var(--accent);color:#0a0a23}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
code{background:var(--surface-2);padding:2px 7px;border-radius:5px;font-family:var(--mono);font-size:.9em;color:#ffd76a}
h1,h2,h3,h4{line-height:1.25}
button{font:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#33334d;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== Топ-панель ===== */
.topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 22px;height:58px;background:rgba(20,20,43,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--text)}
.brand:hover{text-decoration:none}
.brand .logo{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#0a0a23;display:grid;place-items:center;font-family:var(--mono);font-weight:800;font-size:14px}
.brand em{color:var(--accent);font-style:normal}
.nav-right{display:flex;align-items:center;gap:18px}
.nav-progress{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);padding:5px 12px;border-radius:99px;white-space:nowrap}
.nav-progress b{color:var(--accent)}
.nav-link{color:var(--muted);font-size:14px;font-weight:600}
.nav-link:hover{color:var(--text);text-decoration:none}

.container{max-width:1160px;margin:0 auto;padding:0 22px}

/* ===== Кнопки ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid transparent;border-radius:8px;padding:10px 20px;font-weight:700;font-size:15px;transition:.15s;line-height:1.2;text-decoration:none!important}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#0a0a23}
.btn-primary:hover{background:#ffdb4a}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:#3aa1f2}
.btn-green{background:var(--green);color:#12240a}
.btn-green:hover{background:#c0e375}
.btn-outline{background:transparent;color:var(--muted);border-color:var(--border)}
.btn-outline:hover{color:var(--text);border-color:var(--dim)}
.btn-danger{background:transparent;color:var(--red);border-color:rgba(248,33,83,.4)}
.btn-danger:hover{background:rgba(248,33,83,.1)}
.btn-sm{padding:7px 14px;font-size:13.5px;border-radius:7px}
.btn-lg{padding:14px 30px;font-size:17px;border-radius:10px}

/* ===== Главная ===== */
.hero{padding:74px 0 60px;text-align:center;background:radial-gradient(900px 420px at 15% -5%,rgba(25,142,238,.16),transparent),radial-gradient(900px 420px at 85% -5%,rgba(255,195,0,.13),transparent);border-bottom:1px solid var(--border)}
.hero .kicker{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(255,195,0,.35);padding:6px 14px;border-radius:99px;margin-bottom:22px}
.hero h1{font-size:clamp(32px,5.5vw,52px);font-weight:900;letter-spacing:-.02em;margin-bottom:18px}
.hero h1 .yl{color:var(--accent)}
.hero p.sub{max-width:640px;margin:0 auto 30px;color:var(--muted);font-size:18px}
.hero .cta-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:34px}
.stat-chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stat-chips span{font-size:13.5px;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:7px 14px;border-radius:99px}
.stat-chips b{color:var(--text)}
.section{padding:52px 0}
.section-title{font-size:26px;font-weight:800;margin-bottom:8px}
.section-sub{color:var(--muted);margin-bottom:30px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}
.feature{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px}
.feature .fi{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;margin-bottom:14px;font-family:var(--mono);font-weight:800;font-size:17px}
.feature h3{font-size:17px;margin-bottom:8px}
.feature p{color:var(--muted);font-size:14.5px}

/* ===== Карточки сертификатов ===== */
.cert-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.cert-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:12px;transition:.15s}
.cert-card:hover{border-color:var(--dim);transform:translateY(-2px)}
.cert-card .cc-icon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#0a0a23;font-weight:900;font-family:var(--mono);font-size:18px}
.cert-card h3{font-size:19px}
.cert-card p.desc{color:var(--muted);font-size:14.5px;flex:1}
.cert-meta{font-size:13px;color:var(--dim)}
.progress{height:10px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.progress-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim)}
.progress-row b{color:var(--green)}

/* ===== Программа курса ===== */
.cert-head{padding:44px 0 30px;border-bottom:1px solid var(--border);margin-bottom:34px}
.cert-head h1{font-size:clamp(26px,4vw,38px);margin:10px 0 8px}
.cert-head p{color:var(--muted);max-width:700px}
.cert-head .back-link{font-size:14px;color:var(--dim)}
.module{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:26px;background:var(--surface)}
.module-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 22px;background:var(--surface-2);flex-wrap:wrap}
.module-head h2{font-size:17.5px;display:flex;align-items:center;gap:12px}
.module-num{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-weight:800;font-size:13px;flex-shrink:0}
.module-head .m-meta{font-size:13px;color:var(--dim);white-space:nowrap}
.lesson-row{display:flex;align-items:center;gap:14px;padding:13px 22px;border-top:1px solid var(--border);cursor:pointer;color:var(--text);background:transparent;width:100%;text-align:left;transition:.12s}
.lesson-row:hover{background:var(--surface-2);text-decoration:none}
.lesson-row .lt{flex:1;font-size:15.5px}
.lesson-row.done .lt{color:var(--dim)}
.status{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;flex-shrink:0;font-size:13px;color:transparent}
.lesson-row.done .status{background:var(--green);border-color:var(--green);color:#12240a;font-weight:900}
.lesson-tag{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--dim);background:var(--surface-3);border:1px solid var(--border);padding:3px 9px;border-radius:99px;white-space:nowrap}

/* ===== Урок ===== */
.crumbs{display:flex;align-items:center;gap:9px;padding:13px 26px;font-size:13.5px;color:var(--dim);background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.crumbs a{color:var(--dim)}
.crumbs a:hover{color:var(--text)}
.lesson-grid{display:grid;grid-template-columns:minmax(360px,5fr) 7fr;min-height:calc(100vh - 110px)}
.instr,.workspace{min-width:0}
.instr{padding:28px 30px 40px;border-right:1px solid var(--border);overflow-wrap:break-word}
.instr h1{font-size:25px;margin-bottom:6px}
.instr .lmeta{font-size:13px;color:var(--dim);margin-bottom:22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.instr .chip-done{color:var(--green);background:rgba(172,209,87,.12);border:1px solid rgba(172,209,87,.4);padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.theory p{color:var(--muted);margin:12px 0}
.theory pre{margin:14px 0}
pre{background:var(--surface-3);border:1px solid var(--border);border-radius:10px;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.6;color:#e8e8f2}
pre.out{color:var(--green)}
.task-box{background:var(--surface-2);border-left:4px solid var(--accent);border-radius:10px;padding:18px 20px;margin:24px 0}
.task-box h3{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:10px}
.task-box p{color:var(--text);margin:8px 0;font-size:15px}
.task-box pre{margin:10px 0 4px;background:#0d0d1f}
.hints details{border:1px dashed var(--border);border-radius:10px;padding:12px 16px;margin-top:10px}
.hints summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:14.5px}
.hints .hint-item{color:var(--muted);font-size:14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.in-note{font-size:13px;color:var(--dim);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-top:14px}
.in-note b{color:var(--muted)}
.bottom-nav{display:flex;justify-content:space-between;gap:12px;margin-top:34px;flex-wrap:wrap}
.workspace{padding:24px 28px 46px;background:var(--bg)}
.ws-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.ws-top .ws-label{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.editor-wrap{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.CodeMirror{height:340px;font-family:var(--mono);font-size:14px;line-height:1.6}
.fallback-editor{width:100%;min-height:340px;background:#14142b;color:#e6e6f0;border:0;padding:14px;font-family:var(--mono);font-size:14px;line-height:1.6;resize:vertical;outline:none;tab-size:4}
.toolbar{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap;align-items:center}
.toolbar .spacer{flex:1}
.tests{list-style:none;margin:0 0 18px}
.test{display:flex;gap:12px;align-items:flex-start;padding:11px 15px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--surface);font-size:14.5px}
.test .tmark{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;flex-shrink:0;font-size:12px;color:transparent;font-weight:900;margin-top:1px}
.test.pass{border-color:rgba(172,209,87,.55)}
.test.pass .tmark{background:var(--green);border-color:var(--green);color:#12240a}
.test.fail{border-color:rgba(248,33,83,.5)}
.test.fail .tmark{background:var(--red);border-color:var(--red);color:#fff}
.test .terr{display:block;color:#ff9db0;font-size:12.5px;font-family:var(--mono);margin-top:5px;white-space:pre-wrap;word-break:break-word}
.banner{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 20px;border-radius:12px;margin-bottom:18px;flex-wrap:wrap;font-weight:600}
.banner.ok{background:rgba(172,209,87,.1);border:1px solid var(--green);color:var(--green)}
.banner.bad{background:rgba(248,33,83,.08);border:1px solid rgba(248,33,83,.5);color:#ff8ba4}
.console-title{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
.console{background:#0b0b1c;border:1px solid var(--border);border-radius:12px;padding:16px;font-family:var(--mono);font-size:13.5px;line-height:1.65;min-height:86px;max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#dcdce6}
.console .placeholder{color:#5c5c7a}
.console .err{color:#ff7b93;white-space:pre-wrap}
.console .pyout{color:#dcdce6}

/* ===== Сертификат ===== */
.cert-page{padding:40px 0 70px}
.cert-actions{display:flex;gap:12px;align-items:center;justify-content:center;margin:0 0 30px;flex-wrap:wrap}
.cert-actions input{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:11px 16px;border-radius:8px;font-size:15px;min-width:260px}
.certificate{background:#fdfcf7;color:#2b2b2b;border:6px double #b8860b;border-radius:6px;max-width:780px;margin:0 auto;padding:54px 44px;text-align:center;font-family:Georgia,"Times New Roman",serif;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.certificate .cert-brand{font-family:var(--mono);font-weight:800;letter-spacing:.2em;color:#b8860b;font-size:14px;margin-bottom:26px}
.certificate h1{font-size:34px;margin-bottom:6px;color:#1c1c1c}
.certificate .cert-line{color:#777;font-style:italic;margin:14px 0 6px}
.certificate .cert-name{font-size:38px;font-weight:700;border-bottom:2px solid #b8860b;display:inline-block;padding:0 28px 8px;margin:8px 0 14px}
.certificate h2{font-size:21px;color:#8a6d1a;margin:10px 0 4px}
.certificate .cert-sub{color:#666;font-size:14.5px}
.certificate .cert-signs{display:flex;justify-content:space-around;margin-top:44px;gap:20px;flex-wrap:wrap}
.certificate .sig{font-size:13px;color:#555}
.certificate .sig b{display:block;border-top:1px solid #999;padding-top:6px;margin-top:26px;font-weight:600}
.cert-locked{max-width:560px;margin:40px auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:34px;text-align:center}
.cert-locked h2{margin-bottom:10px}
.cert-locked p{color:var(--muted);margin-bottom:20px}

/* ===== Прочее ===== */
.toast{position:fixed;bottom:24px;right:24px;background:var(--green);color:#12240a;padding:13px 20px;border-radius:10px;font-weight:700;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none;z-index:99;max-width:320px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:none}
.footer{border-top:1px solid var(--border);padding:34px 0 44px;color:var(--dim);font-size:13.5px;text-align:center}
.footer a{color:var(--muted)}
.footer .reset-link{background:none;border:none;color:var(--red);font-size:12.5px;margin-top:14px;text-decoration:underline;opacity:.8}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Тема редактора ===== */
.cm-s-pycamp.CodeMirror{background:#14142b;color:#e6e6f0}
.cm-s-pycamp .CodeMirror-gutters{background:#14142b;border-right:1px solid #26264a;padding-right:6px}
.cm-s-pycamp .CodeMirror-linenumber{color:#565678}
.cm-s-pycamp .CodeMirror-cursor{border-left:2px solid var(--accent)}
.cm-s-pycamp .CodeMirror-selected{background:#2d2d55!important}
.cm-s-pycamp .CodeMirror-activeline-background{background:#1d1d3d}
.cm-s-pycamp .cm-keyword{color:#ff7b93;font-weight:600}
.cm-s-pycamp .cm-def{color:#d2a8ff}
.cm-s-pycamp .cm-string{color:#a5d6ff}
.cm-s-pycamp .cm-number{color:#7ee0a3}
.cm-s-pycamp .cm-comment{color:#7a7a99;font-style:italic}
.cm-s-pycamp .cm-operator{color:#8ab8ff}
.cm-s-pycamp .cm-builtin{color:#ffd76a}
.cm-s-pycamp .cm-property{color:#9ad4ff}

@media (max-width:960px){
  .lesson-grid{grid-template-columns:1fr}
  .nav-link{display:none}
  .nav-progress{font-size:12px;padding:4px 10px}
  .topnav{padding:0 14px}
  .instr{border-right:0;border-bottom:1px solid var(--border);padding:22px 20px 30px}
  .CodeMirror{height:280px}
  .fallback-editor{min-height:280px}
  .workspace{padding:20px 16px 40px}
  .certificate{padding:36px 22px}
  .certificate .cert-name{font-size:28px}
}
@media print{
  body{background:#fff}
  .topnav,.crumbs,.cert-actions,.footer,.cert-page .back-link{display:none!important}
  .certificate{box-shadow:none;margin:0 auto}
}
</style>

<body>
<header class="topnav">
  <a class="brand" href="#/"><span class="logo">Py</span>Py<em>Camp</em></a>
  <div class="nav-right">
    <span class="nav-progress" id="nav-progress"></span>
    <a class="nav-link" href="#/">Программа</a>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.min.js"></script>
<script>
"use strict";
/* ============================================================
   PyCamp — данные курса
   Структура: COURSE[сертификат].modules[модуль].lessons[урок]
   ============================================================ */
const COURSE = [
  {
    id: 'basics', title: 'Python: Основы', short: 'Основы', color: '#198eee',
    desc: 'Синтаксис, переменные, типы данных, строки, вывод в консоль и условия — фундамент, на котором строится всё остальное.',
    modules: []
  },
  {
    id: 'data', title: 'Python: Данные и функции', short: 'Данные', color: '#ffc300',
    desc: 'Циклы, списки, словари и функции — инструменты, с которыми программы перестают быть линейными и начинают работать с данными по-настоящему.',
    modules: []
  },
  {
    id: 'pro', title: 'Python: ООП и продвинутые темы', short: 'Про', color: '#d2a8ff',
    desc: 'Классы и объекты, исключения, файлы, модули, генераторы и декораторы — уровень, после которого вы пишете настоящий инженерный код.',
    modules: []
  }
];

/* ============ СЕРТИФИКАТ 1 — МОДУЛЬ 1 ============ */
COURSE[0].modules.push({
  title: 'Первые шаги',
  blurb: 'Что такое Python, как работает print() и из чего вообще состоит программа.',
  lessons: [
    {
      id: 'first-program',
      title: 'Ваш первый код',
      theory: `
        <p>Python — один из самых популярных языков программирования в мире. На нём пишут сайты, анализируют данные, обучают нейросети и автоматизируют рутину. Код на Python читается почти как английский текст, поэтому именно его чаще всего советуют первым языком.</p>
        <p>Любая программа что-то <b>делает</b>, и чаще всего — что-то сообщает пользователю. За вывод текста в Python отвечает функция <code>print()</code>. Всё, что вы поместите внутрь кавычек, будет напечатано в консоли:</p>
        <pre>print("Привет, мир!")</pre>
        <p>Кавычки могут быть двойными <code>"..."</code> или одинарными <code>'...'</code> — Python понимает и то, и другое. Круглые скобки <code>()</code> означают вызов функции, а то, что внутри них, называется <b>аргументом</b>.</p>`,
      task: `<p>Выведите в консоль фразу <code>Я изучаю Python</code>.</p>

/* ===== Python-раннер (выполняется внутри Pyodide) ===== */
const RUNNER_SRC = [
  'import builtins, contextlib, io, json, traceback',
  '',
  'def pycamp_run(code, tests_json, inputs_json):',
  '    tests = json.loads(tests_json)',
  '    inputs = json.loads(inputs_json)',
  '    out = io.StringIO()',
  '    buf = list(inputs)',
  '    orig_input = builtins.input',
  '',
  '    def fake_input(prompt=""):',
  '        if prompt:',
  '            print(prompt, end="")',
  '        if buf:',
  '            v = buf.pop(0)',
  '            print(v)',
  '            return v',
  '        raise EOFError("нет заготовленного ответа для input()")',
  '',
  '    builtins.input = fake_input',
  '    ns = {"__name__": "__main__"}',
  '    error = None',
  '    try:',
  '        with contextlib.redirect_stdout(out):',
  '            exec(compile(code, "solution.py", "exec"), ns)',
  '    except BaseException as e:',
  '        error = "".join(traceback.format_exception_only(type(e), e)).strip()',
  '    builtins.input = orig_input',
  '',
  '    results = []',
  '    if error is None:',
  '        ns["OUT"] = out.getvalue()',
  '        ns["SOURCE"] = code',
  '        ns["NS"] = ns',
  '        for t in tests:',
  '            try:',
  '                exec(t["code"], ns)',
  '                results.append({"name": t["name"], "passed": True, "msg": ""})',
  '            except AssertionError:',
  '                results.append({"name": t["name"], "passed": False, "msg": "условие пока не выполнено"})',
  '            except BaseException as e:',
  '                msg = "".join(traceback.format_exception_only(type(e), e)).strip()',
  '                results.append({"name": t["name"], "passed": False, "msg": msg})',
  '    else:',
  '        results = [{"name": t["name"], "passed": False, "msg": ""} for t in tests]',
  '    return json.dumps({"stdout": out.getvalue(), "error": error, "results": results}, ensure_ascii=False)'
].join('\n');

/* ===== Утилиты ===== */
const $app = document.getElementById('app');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const store = {
  get(key, def) {
    try { const v = localStorage.getItem('pycamp_' + key); return v === null ? def : JSON.parse(v); }
    catch (e) { return def; }
  },
  set(key, val) { try { localStorage.setItem('pycamp_' + key, JSON.stringify(val)); } catch (e) {} },
  del(key) { try { localStorage.removeItem('pycamp_' + key); } catch (e) {} }
};

let doneMap = store.get('done', {});
const isDone = id => !!doneMap[id];
function setDone(id) {
  if (doneMap[id]) return;
  doneMap[id] = true;
  store.set('done', doneMap);
  updateNavProgress();
  checkCertCompletion();
}
function checkCertCompletion() {
  COURSE.forEach((c, ci) => {
    const all = c.modules.flatMap(m => m.lessons);
    if (all.every(l => isDone(l.id)) && !store.get('certdate_' + c.id, null)) {
      store.set('certdate_' + c.id, new Date().toISOString());

}

COURSE.forEach((c, ci) => c.modules.forEach((m, mi) => m.lessons.forEach((l, li) => {

let toastTimer = null;
function toast(msg) {

/* ===== Движок Pyodide ===== */
const PYODIDE_URL = 'https://cdn.jsdelivr.net/pyodide/v0.25.1/full/';
let pyPromise = null;
function ensurePy() {
  if (!pyPromise) {
    pyPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = PYODIDE_URL + 'pyodide.js';
      s.onload = () => {
        loadPyodide({ indexURL: PYODIDE_URL }).then(resolve, reject);
      };
      s.onerror = () => reject(new Error('Не удалось загрузить Pyodide с CDN'));
      document.head.appendChild(s);
    });
  }
  return pyPromise;
}
let runnerReady = false;
async function getPy() {
  const py = await ensurePy();
  if (!runnerReady) {
    py.runPython(RUNNER_SRC);
    runnerReady = true;
  }
  return py;
}
async function runPythonCode(code, tests, inputs) {
  const py = await getPy();
  const fn = py.globals.get('pycamp_run');
  try {
    const raw = fn(code, JSON.stringify(tests || []), JSON.stringify(inputs || []));
    return JSON.parse(raw);
  } finally {
    try { fn.destroy(); } catch (e) {}
  }
}

function makeEditor(container, initial, onChange) {
  if (typeof CodeMirror !== 'undefined') {
    const cm = CodeMirror(container, {
      value: initial,
      mode: 'python',
      theme: 'pycamp',
      lineNumbers: true,
      indentUnit: 4,
      smartIndent: true,
      matchBrackets: true,
      lineWrapping: true
    });
    cm.on('change', () => onChange('change', cm.getValue()));
    return {
      getValue: () => cm.getValue(),
      setValue: v => cm.setValue(v),
      focus: () => cm.focus()
    };
  }
  const ta = document.createElement('textarea');
  ta.className = 'fallback-editor';
  ta.spellcheck = false;
  ta.value = initial;
  ta.addEventListener('input', () => onChange('change', ta.value));
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const st = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0, st) + '    ' + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = st + 4;
      onChange('change', ta.value);
    }
  });
  container.appendChild(ta);
  return {
    getValue: () => ta.value,
    setValue: v => { ta.value = v; },
    focus: () => ta.focus()
  };
}

        <div class="cert-locked">
          <h2>Сертификат пока не открыт</h2>
          <p>Пройдено ${d} из ${all.length} уроков курса «${c.title}». Завершите все уроки — и сертификат появится здесь.</p>
          <div class="progress"><i style="width:${pct0(d, all.length)}%"></i></div>
          <p style="margin-top:10px;font-size:13px;color:var(--dim)">${Math.round(d / all.length * 100)}%</p>
          <a class="btn btn-primary" href="#/lesson/${(all.find(l => !isDone(l.id)) || all[0]).id}">Продолжить курс</a>
        </div>
      </div>`;
  }
  const iso = store.get('certdate_' + c.id, new Date().toISOString());
  const name = store.get('name_' + c.id, '');
  return `
    <div class="container cert-page">
      <a class="back-link" href="#/cert/${c.id}" style="font-size:14px;color:var(--dim)">← К программе курса</a>
      <div class="cert-actions">
        <input id="cert-name" type="text" placeholder="Ваше имя на сертификате" value="${esc(name)}" maxlength="60">
        <button class="btn btn-primary btn-sm" id="print-btn">Печать / PDF</button>
      </div>
      <div class="certificate">
        <div class="cert-brand">PYCAMP</div>
        <h1>Сертификат об окончании</h1>
        <p class="cert-line">вручается</p>
        <div class="cert-name" id="cert-name-view">${esc(name) || 'Ваше имя'}</div>
        <p class="cert-sub">за успешное прохождение курса</p>
        <h2>${c.title}</h2>
        <p class="cert-sub">${all.length} уроков · ${c.modules.length} модулей · успешно пройдены все тесты</p>
        <p class="cert-sub" style="margin-top:18px">Дата окончания: ${fmtDate(iso)}</p>
        <div class="cert-signs">
          <div class="sig">Основатель платформы<b>PyCamp</b></div>
          <div class="sig">Директор по обучению<b>Python Team</b></div>
        </div>
      </div>
    </div>`;
}
function pct0(a, b) { return Math.round(a / b * 100); }

/* ============================================================
   Логика урока
   ============================================================ */
let currentEditor = null;

function bindLesson(lessonId) {
  const ctx = LMAP[lessonId];
  if (!ctx) return;
  const { l } = ctx;

  const editorHost = document.getElementById('editor');
  const consoleEl = document.getElementById('console');
  const bannerEl = document.getElementById('banner');
  const runBtn = document.getElementById('run-btn');
  const testBtn = document.getElementById('test-btn');
  const resetBtn = document.getElementById('reset-btn');

  let saveTimer = null;
  currentEditor = makeEditor(editorHost, l.starter, (type, val) => {
    if (type === 'change') {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => store.set('code_' + l.id, val), 400);
    }
  });

  function setBusy(busy) {
    runBtn.disabled = busy;
    testBtn.disabled = busy;
    testBtn.innerHTML = busy ? '<span class="spinner"></span> Выполняю…' : '✓ Запустить тесты';
  }

  function renderConsole(data) {
    let html = '';
    if (data.stdout) {
      const out = data.stdout.length > 15000 ? data.stdout.slice(0, 15000) + '\n… (вывод обрезан)' : data.stdout;
      html += '<span class="pyout">' + esc(out) + '</span>';
    }
    if (data.error) {
      html += '<span class="err">⚠ ' + esc(data.error) + '</span>';
    }
    consoleEl.innerHTML = html || '<span class="placeholder">Программа завершилась без вывода.</span>';
    consoleEl.scrollTop = 0;
  }

  function renderTests(results) {
    results.forEach((r, i) => {
      const el = document.getElementById('test-' + i);
      if (!el) return;
      el.className = 'test ' + (r.passed ? 'pass' : 'fail');
      el.innerHTML = '<span class="tmark">✓</span><span>' + esc(r.name) +
        (r.passed ? '' : '<span class="terr">' + esc(r.msg || '') + '</span>') + '</span>';
    });
  }

  function showBanner(ok) {
    const flatIdx = FLAT.indexOf(ctx);
    const next = FLAT[flatIdx + 1];
    if (ok) {
      const nextHtml = next
        ? `<a class="btn btn-green btn-sm" href="#/lesson/${next.l.id}">Следующий урок →</a>`
        : `<a class="btn btn-green btn-sm" href="#/certificate/${ctx.c.id}">Получить сертификат →</a>`;
      bannerEl.innerHTML = `<div class="banner ok"><span>✓ Отлично! Все тесты пройдены — урок завершён.</span>${nextHtml}</div>`;
    } else {
      bannerEl.innerHTML = `<div class="banner bad"><span>Тесты не все зелёные — проверьте вывод, задание и подсказки.</span></div>`;
    }
  }

  async function execute(withTests) {
    setBusy(true);
    bannerEl.innerHTML = '';
    try {
      const data = await runPythonCode(currentEditor.getValue(), withTests ? l.tests : null, l.inputs || []);
      renderConsole(data);
      if (withTests) {
        renderTests(data.results);
        const allPass = data.error === null && data.results.length > 0 && data.results.every(r => r.passed);
        showBanner(allPass);
        if (allPass) {
          if (!isDone(l.id)) { setDone(l.id); toast('Урок завершён! Отличная работа.'); }
          const meta = document.querySelector('.lmeta');
          if (meta && !meta.querySelector('.chip-done')) {
            meta.insertAdjacentHTML('beforeend', '<span class="chip-done">✓ урок завершён</span>');
          }
        }
      }
    } catch (e) {
      consoleEl.innerHTML = '<span class="err">⚠ Не удалось запустить Python: ' + esc(e && e.message ? e.message : e) +
        '.\nПроверьте подключение к интернету — движок Pyodide загружается с CDN при первом запуске (~10 МБ).</span>';
    } finally {
      setBusy(false);
    }
  }

  runBtn.addEventListener('click', () => execute(false));
  testBtn.addEventListener('click', () => execute(true));
  resetBtn.addEventListener('click', () => {
    if (confirm('Вернуть код урока к исходному виду?')) {
      currentEditor.setValue(l.starter);
      store.del('code_' + l.id);
      toast('Код сброшен');
    }
  });
  currentEditor.focus();
}

/* ============================================================
   Роутер
   ============================================================ */
function render() {
  const hash = location.hash || '#/';
  const parts = hash.replace(/^#\//, '').split('/');
  let title = 'PyCamp — учи Python бесплатно, прямо в браузере';

  if (parts[0] === '' || parts[0] === undefined) {
    $app.innerHTML = viewHome();
    bindHome();
  } else if (parts[0] === 'cert' && COURSE[parts[1] !== undefined ? COURSE.findIndex(c => c.id === parts[1]) : -1]) {
    const ci = COURSE.findIndex(c => c.id === parts[1]);
    $app.innerHTML = viewCert(ci);
    title = COURSE[ci].title + ' — PyCamp';
  } else if (parts[0] === 'lesson' && LMAP[parts[1]]) {
    const ctx = LMAP[parts[1]];
    $app.innerHTML = viewLesson(parts[1]);
    bindLesson(parts[1]);
    title = ctx.l.title + ' — PyCamp';
  } else if (parts[0] === 'certificate' && COURSE.findIndex(c => c.id === parts[1]) >= 0) {
    const ci = COURSE.findIndex(c => c.id === parts[1]);
    $app.innerHTML = viewCertificate(ci);
    bindCertificate(ci);
    title = 'Сертификат — PyCamp';
  } else {
    location.replace('#/');
    return;
  }
  document.title = title;
  window.scrollTo(0, 0);
}

function bindHome() {
  const btn = document.getElementById('reset-all');
  if (btn) btn.addEventListener('click', () => {
    if (confirm('Сбросить весь прогресс и весь сохранённый код? Это действие необратимо.')) {
      Object.keys(localStorage).filter(k => k.startsWith('pycamp_')).forEach(k => localStorage.removeItem(k));
      doneMap = {};
      updateNavProgress();
      render();
      toast('Прогресс сброшен');
    }
  });
}

function bindCertificate(ci) {
  const c = COURSE[ci];
  const inp = document.getElementById('cert-name');
  const view = document.getElementById('cert-name-view');
  const printBtn = document.getElementById('print-btn');
  if (inp && view) {
    inp.addEventListener('input', () => {
      view.textContent = inp.value.trim() || 'Ваше имя';
      store.set('name_' + c.id, inp.value.trim());
    });
  }
  if (printBtn) printBtn.addEventListener('click', () => window.print());
}

/* Ctrl+Enter — запуск тестов */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    const tb = document.getElementById('test-btn');
    if (tb && !tb.disabled) {
      e.preventDefault();
      tb.click();
    }
  }
});

/* ===== Инициализация ===== */
window.addEventListener('hashchange', render);
updateNavProgress();
render();
</script>
</body>
</html>
