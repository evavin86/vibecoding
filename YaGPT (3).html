<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Mastery - Interactive Learning</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --sidebar-bg: #161b22;
            --card-bg: #21262d;
            --accent: #238636;
            --accent-hover: #2ea043;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --error: #f85149;
            --success: #3fb950;
            --border: #30363d;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
        }

        /* Sidebar */
        #sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            font-size: 1.2rem;
            font-weight: bold;
            color: var        accent;
        }

        .lesson-item {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background 0.2s;
        }

        .lesson-item:hover {
            background-color: var(--card-bg);
        }

        .lesson-item.active {
            background-color: #1f2937;
            border-left: 4px solid var(--accent);
        }

        .status-icon {
            margin-right: 10px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid var(--text-dim);
        }

        .status-icon.completed {
            background-color: var(--success);
            border-color: var(--success);
        }

        /* Main Content */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #content-area {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        h1 { color: #fff; margin-top: 0; }
        p { line-height: 1.6; font-size: 1.1rem; }
        code { background: #30363d; padding: 2px 5px; border-radius: 4px; font-family: monospace; }

        /* Editor Section */
        #editor-section {
            background-color: var(--sidebar-bg);
            border-top: 1px solid var(--border);
            padding: 20px 40px;
        }

        .editor-wrapper {
            background: #000;
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: transparent;
            color: #d1d5db;
            border: none;
            padding: 15px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 16px;
            resize: none;
            outline: none;
            boxint: border-box;
        }

        .editor-footer {
            padding: 10px 15px;
            background: #161b22;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid var(--border);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--accent-hover); }

        #feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            font-weight: 500;
        }

        .feedback-error { background: rgba(248, 81, 73, 0.1); color: var(--error); border: 1px solid var(--error); }
        .feedback-success { background: rgba(63, 185, 80, 0.1); color: var(--success); border: 1px solid var(--success); }

        /* Progress Bar */
        #progress-container {
            width: 100%;
            height: 5px;
            background: var(--border);
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">Python Course</div>
    <div id="progress-container"><div id="progress-bar"></div></div>
    <div id="lesson-list"></div>
</div>

<div id="main-content">
    <div id="content-array">
        <div id="content-area">
            <h1 id="lesson-title">Загрузка...</h1>
            <div id="lesson-description"></div>
        </div>
    </div>

    <div id="editor-section">
        <div class="editor-wrapper">
            <textarea id="code-input" spellcheck="false" placeholder="# Напишите код здесь..."></textarea>
        </div>
        <div class="editor-footer">
            <button onclick="checkSolution()">Проверить решение</button>
        </div>
        <div id="feedback"></div>
    </div>
</div>

<script>
    const courseData = [
        {
            title: "Введение в переменные",
            description: "Переменные используются для хранения данных. Чтобы создать переменную, используйте знак <code>=</code>. <br><br><b>Задание:</b> Создайте переменную <code>score</code> и присвойте ей значение <code>100</code>.",
            instruction: "score = 100",
            check: (code) => code.includes("score = 100") || code.includes("score=100")
        },
        {
            title: "Типы данных: Строки",
            description: "Строки — это последовательности символов в кавычках. <br><br><b>Задание:</b> Создайте переменную <code>greeting</code> со значением <code>'Hello'</code>.",
            instruction: "greeting = 'Hello'",
            check: (code) => code.includes("greeting = 'Hello'") || code.includes("greeting='Hello'")
        },
        {
            title: "Типы данных: Числа",
            description: "Python поддерживает целые (int) и дробные (float) числа. <br><br><b>Задание:</b> Создайте переменную <code>pi</code> со значением <code>3.14</code>.",
            instruction: "pi = 3.14",
            check: (code) => code.includes("pi = 3.14")
        },
        {
            title: "Списки (Lists)",
            description: "Списки позволяют хранить много элементов в одной переменной. <br><br><b>Задание:</b> Создайте список <code>nums</code>, содержащий числа <code>1, 2, 3</code>.",
            instruction: "nums = [1, 2, 3]",
            check: (code) => code.includes("nums = [1, 2, 3]")
        },
        {
            title: "Условный оператор (if)",
            description: "Оператор <code>if</code> позволяет выполнять код, если условие верно. <br><br><b>Задание:</b> Напишите <code>if x > 5:</code> (предположим, x уже есть).",
            instruction: "if x > 5:",
            check: (code) => code.includes("if x > 5:")
        }
    ];

    let currentLessonIndex = 0;
    let completedLessons = new Set();

    const lessonListEl = document.getElementById('lesson-list');
    const titleEl = document.getElementById('protein-title') || document.getElementById('lesson-title');
    const descEl = document.getElementById('lesson-description');
    const codeInput = document.getElementById('code-input');
    const feedbackEl = document.getElementById('feedback');
    const progressBar = document.getElementById('progress-bar');

    function init() {
        renderSidebar();
        loadLesson(0);
    }

    function renderSidebar() {
        lessonListEl.innerHTML = '';
        courseData.forEach((lesson, index) => {
            const item = document.createElement('div');
            item.className = `lesson-item ${index === currentLessonIndex ? 'active' : ''}`;
            
            const icon = document.createElement('div');
            icon.className = `status-icon ${completedLessons.has(index) ? 'completed' : ''}`;
            
            const text = document.createElement('span');
            text.innerText = lesson.title;

            item.appendChild(icon);
            item.appendChild(text);
            item.onclick = () => loadLesson(index);
            lessonListEl.appendChild(item);
        });

        // Update Progress
        const progress = (completedLessons.size / courseData.length) * 100;
        progressBar.style.width = `${progress}%`;
    }

    function loadLesson(index) {
        currentLessonIndex = index;
        const lesson = courseData[index];
        
        titleEl.innerText = lesson.title;
        descEl.innerHTML = lesson.description;
        codeInput.value = "";
        feedbackEl.style.display = 'none';
        
        renderSidebar();
    }

    function checkSolution() {
        const code = codeInput.value;
        const lesson = courseData[currentLessonIndex];
        
        feedbackEl.style.display = 'block';

        if (lesson.check(code)) {
            feedbackEl.className = 'feedback-success';
            feedbackEl.innerText = "✅ Отлично! Задание выполнено.";
            completedLessons.add(currentLessonIndex);
            
            // Auto-advance
            setTimeout(() => {
                if (currentLessonIndex < courseData.length - 1) {
                    loadLesson(currentLessonIndex + 1);
                } else {
                    feedbackEl.innerText = "🏆 Поздравляем! Вы прошли весь курс!";
                }
                renderSidebar();
            }, 1500);
        } else {
            feedbackEl.className = 'feedback-error';
            feedbackEl.innerText = "❌ Ошибка. Попробуй еще раз. Подсказка: " + lesson.instruction;
        }
    }

    init();
</script>

</body>
</html>
