        .replace(/^### (.+)$/gm, '<h3 class="text-lg font-bold text-white mt-3 mb-1">$1</h3>')
        .replace(/^## (.+)$/gm, '<h2 class="text-xl font-bold text-[#f0db00] mt-4 mb-2">$1</h2>')
        .replace(/^# (.+)$/gm, '<h1 class="text-2xl font-bold text-white mt-4 mb-2">$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong class="text-white">$1</strong>')
        .replace(/`([^`]+)`/g, '<code class="bg-[#2a2a4a] px-1.5 py-0.5 rounded text-[#f0db00] text-sm">$1</code>')
        .replace(/^- (.+)$/gm, '<li class="ml-4 text-gray-300 list-none">• $1</li>');
      return html;
    }

                  </button>
                )}
                <button onClick={() => setShowProfile(false)} className="w-full bg-[#3b3b5a] text-white py-2 rounded-lg hover:bg-[#4b4b6a] transition">Закрыть</button>
              </div>
            </div>
          )}

          {/* CERTIFICATE MODAL */}
          {showCertificate && (
            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4" onClick={() => setShowCertificate(false)}>
              <div className="bg-gradient-to-br from-[#1b1b32] to-[#2a2a5a] rounded-2xl p-8 w-full max-w-lg text-center border-2 border-[#f0db00] fade-in" onClick={e => e.stopPropagation()}>
                <div className="text-6xl mb-4">🎓</div>
                <h2 className="text-3xl font-bold text-[#f0db00] mb-2">Сертификат</h2>
                <p className="text-gray-300 mb-4">о прохождении курса</p>
                <div className="bg-[#0a0a23] rounded-xl p-6 mb-4">
                  <p className="text-lg text-gray-400">Настоящий сертификат подтверждает, что</p>
                  <p className="text-2xl font-bold text-white my-3">{userName || 'Студент'}</p>
                  <p className="text-lg text-gray-400">успешно завершил(а) полный курс</p>
                  <p className="text-xl font-bold text-[#f0db00] mt-2">Python Programming</p>
                  <p className="text-sm text-gray-500 mt-4">PyCodeCamp • {new Date().toLocaleDateString('ru')}</p>
                </div>
                <button onClick={() => setShowCertificate(false)} className="bg-[#f0db00] text-[#0a0a23] font-bold px-8 py-3 rounded-lg hover:bg-[#d4c200] transition">Закрыть</button>
              </div>
            </div>
          )}

          <div className="flex flex-1 overflow-hidden">
            {/* SIDEBAR */}
            <aside className={`${showSidebar ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0 fixed lg:relative z-40 w-72 h-[calc(100vh-57px)] bg-[#1b1b32] border-r border-[#2a2a4a] overflow-y-auto transition-transform duration-300 shrink-0`}>
              <div className="p-4">
                <h2 className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Программа курса</h2>
                {courseData.map((section, sIdx) => (
                  <div key={section.id} className="mb-1">
                    <button onClick={() => toggleSection(sIdx)}
                      className={`w-full text-left px-3 py-2.5 rounded-lg flex items-center gap-2 transition ${currentSection === sIdx ? 'bg-[#2a2a4a] text-[#f0db00]' : 'text-gray-300 hover:bg-[#2a2a4a]/50'}`}>
                      <span className="text-lg">{section.icon}</span>
                      <span className="text-sm font-medium flex-1 text-left">{section.title}</span>
                      <span className="text-xs text-gray-500">{section.lessons.filter(l => completedLessons.includes(l.id)).length}/{section.lessons.length}</span>
                      <i className={`fas fa-chevron-${expandedSections.has(sIdx) ? 'down' : 'right'} text-xs text-gray-500`}></i>
                    </button>
                    {expandedSections.has(sIdx) && (
                      <div className="ml-4 mt-1 space-y-0.5 border-l border-[#2a2a4a] pl-3">
                        {section.lessons.map((l, lIdx) => (
                          <button key={l.id} onClick={() => goToLesson(sIdx, lIdx)}
                            className={`w-full text-left px-2 py-1.5 rounded text-sm flex items-center gap-2 transition ${currentLesson === lIdx && currentSection === sIdx ? 'bg-[#f0db00]/10 text-[#f0db00]' : 'text-gray-400 hover:text-white'}`}>
                            {completedLessons.includes(l.id) ? <i className="fas fa-check-circle text-green-400 text-xs"></i> : <i className="far fa-circle text-gray-600 text-xs"></i>}
                            <span className="truncate">{l.title}</span>
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </aside>

            {/* MAIN CONTENT */}
            <main className="flex-1 flex flex-col lg:flex-row overflow-hidden">
              {/* Lesson */}
              <div className="flex-1 overflow-y-auto p-4 lg:p-6">
                {lesson && (
                  <div className="max-w-3xl mx-auto fade-in">
                    <div className="mb-4 flex items-center gap-2 text-sm text-gray-400 flex-wrap">
                      <span>{courseData[currentSection].icon}</span>
                      <span>{courseData[currentSection].title}</span>
                      <span>→</span>
                      <span className="text-white font-medium">{lesson.title}</span>
                      {isCompleted && <span className="ml-2 text-green-400"><i className="fas fa-check-circle"></i> Пройдено</span>}
                    </div>
                    <div className="bg-[#1b1b32] rounded-xl p-6 border border-[#2a2a4a] mb-4">
                      <div className="text-gray-200 leading-relaxed" dangerouslySetInnerHTML={{ __html: renderMarkdown(lesson.content) }} />
                    </div>
                    <div className="mb-4">
                      <button onClick={() => setShowHint(!showHint)} className="text-sm text-[#f0db00] hover:text-[#d4c200] flex items-center gap-1">
                        <i className="fas fa-lightbulb"></i> {showHint ? 'Скрыть подсказку' : 'Показать подсказку'}
                      </button>
                      {showHint && <div className="mt-2 bg-[#f0db00]/10 border border-[#f0db00]/30 rounded-lg p-3 text-sm text-[#f0db00]">💡 {lesson.hint}</div>}
                    </div>
                    {testResults.length > 0 && (
                      <div className="mb-4 bg-[#1b1b32] rounded-xl p-4 border border-[#2a2a4a] fade-in">
                        <h3 className="font-bold mb-2 text-sm text-gray-400 uppercase">Результаты проверки:</h3>
                        {testResults.map((r, i) => (
                          <div key={i} className={`flex items-center gap-2 py-1 text-sm ${r.passed ? 'text-green-400' : 'text-red-400'}`}>
                            <i className={`fas ${r.passed ? 'fa-check-circle' : 'fa-times-circle'}`}></i><span>{r.text}</span>
                          </div>
                        ))}
                        {testResults.every(r => r.passed) && (
                          <div className="mt-3 pt-3 border-t border-[#2a2a4a] text-green-400 font-bold flex items-center gap-2">
                            <i className="fas fa-star"></i><span>Все тесты пройдены! Отличная работа!</span>
                          </div>
                        )}
                      </div>
                    )}
                    <div className="flex justify-between items-center mt-6 pt-4 border-t border-[#2a2a4a]">
                      <button onClick={prevLesson} disabled={currentSection === 0 && currentLesson === 0}
                        className="flex items-center gap-2 px-4 py-2 bg-[#1b1b32] rounded-lg hover:bg-[#2a2a4a] transition disabled:opacity-30 disabled:cursor-not-allowed">
                        <i className="fas fa-arrow-left"></i><span className="hidden sm:inline">Назад</span>
                      </button>
                      <button onClick={nextLesson}
                        disabled={currentSection === courseData.length - 1 && currentLesson === courseData[currentSection].lessons.length - 1}
                        className="flex items-center gap-2 px-4 py-2 bg-[#f0db00] text-[#0a0a23] font-bold rounded-lg hover:bg-[#d4c200] transition disabled:opacity-30 disabled:cursor-not-allowed">
                        <span className="hidden sm:inline">Далее</span><i className="fas fa-arrow-right"></i>
                      </button>
                    </div>
                  </div>
                )}
              </div>

              {/* CODE EDITOR */}
              <div className="lg:w-[480px] xl:w-[540px] border-t lg:border-t-0 lg:border-l border-[#2a2a4a] flex flex-col bg-[#1b1b32] shrink-0 h-[45vh] lg:h-full">
                <div className="flex items-center justify-between px-4 py-2 border-b border-[#2a2a4a] bg-[#0a0a23]">
                  <div className="flex items-center gap-2">
                    <div className="flex gap-1.5">
                      <div className="w-3 h-3 rounded-full bg-red-500"></div>
                      <div className="w-3 h-3 rounded-full bg-yellow-500"></div>
                      <div className="w-3 h-3 rounded-full bg-green-500"></div>
                    </div>
                    <span className="text-sm text-gray-400 ml-2">editor.py</span>
                  </div>
                  <div className="flex items-center gap-2">
                    {pyodideLoading && <span className="text-xs text-yellow-400 flex items-center gap-1"><i className="fas fa-spinner fa-spin"></i>Загрузка Python...</span>}
                    {!pyodideLoading && pyodide && <span className="text-xs text-green-400 flex items-center gap-1"><i className="fas fa-circle text-[6px]"></i>Python готов</span>}
                  </div>
                </div>
                <div className="flex-1 relative overflow-hidden">
                  <textarea ref={codeRef} value={code} onChange={e => setCode(e.target.value)}
                    className="w-full h-full bg-[#0a0a23] text-green-300 p-4 font-mono text-sm resize-none focus:outline-none leading-relaxed"
                    spellCheck={false} placeholder="# Напишите ваш код на Python..."
                    onKeyDown={e => {
                      if (e.key === 'Tab') {
                        e.preventDefault();
                        const s = e.currentTarget.selectionStart, end = e.currentTarget.selectionEnd;
                        const nc = code.substring(0, s) + '    ' + code.substring(end);
                        setCode(nc);
                        setTimeout(() => { if (codeRef.current) { codeRef.current.selectionStart = codeRef.current.selectionEnd = s + 4; } }, 0);
                      }
                      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runCode(); }
                    }} />
                </div>
                <div className="border-t border-[#2a2a4a]">
                  <div className="flex items-center gap-2 px-4 py-2">
                    <button onClick={runCode} disabled={isRunning || pyodideLoading}
                      className="flex items-center gap-2 px-4 py-2 bg-[#f0db00] text-[#0a0a23] font-bold rounded-lg hover:bg-[#d4c200] transition disabled:opacity-50 disabled:cursor-not-allowed text-sm">
                      {isRunning ? <><i className="fas fa-spinner fa-spin"></i>Выполняется...</> : <><i className="fas fa-play"></i>Запустить (Ctrl+Enter)</>}
                    </button>
                    <button onClick={() => { setCode(lesson?.initialCode || ''); setOutput(''); setTestResults([]); }}
                      className="px-3 py-2 bg-[#2a2a4a] text-gray-300 rounded-lg hover:bg-[#3b3b5a] transition text-sm" title="Сбросить код">
                      <i className="fas fa-redo"></i>
                    </button>
                  </div>
                  {output && (
                    <div className="px-4 pb-3">
                      <div className="bg-[#0a0a23] rounded-lg p-3 font-mono text-sm max-h-32 overflow-y-auto border border-[#2a2a4a]">
                        <div className="text-gray-500 text-xs mb-1">Вывод:</div>
                        <pre className="text-gray-200 whitespace-pre-wrap">{output}</pre>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </main>
          </div>

          {showSidebar && <div className="fixed inset-0 bg-black/50 z-30 lg:hidden" onClick={() => setShowSidebar(false)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
