<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>freePyCamp — бесплатный курс Python</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css" />
  <style>
    :root {
      --navy: #0a0a23;
      --navy-2: #1b1b32;
      --navy-3: #2a2a40;
      --gold: #f1be32;
      --gold-2: #ffbf00;
      --text: #f5f6f7;
      --muted: #afafc7;
      --ok: #4caf50;
      --bad: #ff6b6b;
      --blue: #99c9ff;
      --header: 52px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--navy); color: var(--text); font-family: Lato, system-ui, sans-serif; }
    a { color: var(--gold); }
    button { font-family: inherit; cursor: pointer; }
    .hdr {
      height: var(--header); background: var(--navy); border-bottom: 1px solid #3b3b4f;
      display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: sticky; top: 0; z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; letter-spacing: .4px; cursor: pointer; }
    .brand .mark { background: var(--gold); color: #0a0a23; width: 28px; height: 28px; display: grid; place-items: center; font-weight: 900; border-radius: 2px; }
    .hdr-right { display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--muted); }
    .pill { background: var(--navy-3); padding: 4px 10px; border-radius: 999px; color: var(--gold); font-weight: 700; }
    .py-status { font-size: 12px; }
    .py-status.ready { color: var(--ok); }

    .home { max-width: 980px; margin: 0 auto; padding: 56px 20px 80px; }
    .hero h1 { font-size: clamp(32px, 6vw, 56px); line-height: 1.15; margin: 0 0 16px; font-weight: 900; }
    .hero p { font-size: 20px; color: var(--muted); max-width: 640px; }
    .cta { margin: 28px 0 48px; display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      border: none; padding: 12px 18px; font-weight: 700; font-size: 16px; background: var(--gold); color: #0a0a23;
    }
    .btn:hover { background: var(--gold-2); }
    .btn.ghost { background: transparent; color: var(--text); border: 2px solid var(--gold); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 40px; }
    .stat { background: var(--navy-2); padding: 18px; border: 1px solid #3b3b4f; }
    .stat b { display: block; font-size: 28px; color: var(--gold); }
    .map h2 { margin: 0 0 8px; }
    .map-lead { color: var(--muted); margin-bottom: 18px; }
    .section-card { background: var(--navy-2); border: 1px solid #3b3b4f; margin-bottom: 12px; }
    .section-head { display: flex; justify-content: space-between; gap: 12px; padding: 16px 18px; cursor: pointer; align-items: center; }
    .section-head h3 { margin: 0; font-size: 18px; }
    .section-meta { color: var(--muted); font-size: 13px; }
    .lessons { display: none; padding: 0 8px 12px; }
    .section-card.open .lessons { display: block; }
    .lesson-row {
      display: flex; align-items: center; gap: 10px; padding: 10px 10px; color: var(--text); text-decoration: none;
      border-left: 3px solid transparent;
    }
    .lesson-row:hover { background: var(--navy-3); }
    .lesson-row.done { border-left-color: var(--ok); }
    .lesson-row.current { border-left-color: var(--gold); background: #23233b; }
    .dot { width: 14px; height: 14px; border: 2px solid var(--muted); border-radius: 50%; flex: none; }
    .lesson-row.done .dot { background: var(--ok); border-color: var(--ok); }
    .cert-banner {
      margin-top: 28px; padding: 22px; border: 2px solid var(--gold); background: #16162b; display: none;
    }
    .cert-banner.show { display: block; }

    .workspace { height: calc(100vh - var(--header)); display: grid; grid-template-columns: minmax(280px, 42%) 1fr; min-height: 0; }
    .instr { background: var(--navy-2); overflow: auto; border-right: 1px solid #3b3b4f; padding: 18px 20px 40px; }
    .crumb { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .instr h1 { font-size: 24px; margin: 0 0 12px; }
    .instr h2 { font-size: 18px; margin: 22px 0 8px; color: var(--gold); }
    .instr p, .instr li { line-height: 1.55; color: #d0d0e0; }
    .instr code, .console code { font-family: "Roboto Mono", monospace; background: #0a0a23; padding: 1px 5px; }
    .instr pre {
      background: #0a0a23; padding: 12px; overflow: auto; font-family: "Roboto Mono", monospace; font-size: 13px;
      border-left: 3px solid var(--gold);
    }
    .tests { margin-top: 16px; }
    .test { padding: 8px 10px; background: #121228; margin: 6px 0; font-size: 14px; border-left: 3px solid #666; }
    .test.pass { border-left-color: var(--ok); color: #b6f2b6; }
    .test.fail { border-left-color: var(--bad); color: #ffc9c9; }
    .hint { display: none; background: #2b2410; border: 1px solid var(--gold); padding: 12px; margin-top: 12px; }
    .hint.show { display: block; }
    .right { display: grid; grid-template-rows: auto 1fr 160px auto; min-width: 0; min-height: 0; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px; background: #111128; border-bottom: 1px solid #3b3b4f; }
    .tbtn { background: var(--navy-3); color: var(--text); border: 1px solid #4d4d70; padding: 8px 12px; font-weight: 700; }
    .tbtn.primary { background: var(--gold); color: #0a0a23; border-color: var(--gold); }
    .tbtn:disabled { opacity: .5; cursor: not-allowed; }
    .CodeMirror { height: 100%; font-size: 14px; font-family: "Roboto Mono", monospace; }
    .console {
      background: #010101; color: #cdeccd; font-family: "Roboto Mono", monospace; font-size: 13px;
      overflow: auto; padding: 10px 12px; border-top: 1px solid #3b3b4f; white-space: pre-wrap;
    }
    .console .err { color: var(--bad); }
    .navless { display: flex; justify-content: space-between; padding: 8px; background: #111128; border-top: 1px solid #3b3b4f; }
    .overlay {
      position: fixed; inset: 0; background: rgba(10,10,35,.86); display: grid; place-items: center; z-index: 50; text-align: center; padding: 20px;
    }
    .overlay.hidden { display: none; }
    .spin { width: 42px; height: 42px; border: 4px solid #3b3b4f; border-top-color: var(--gold); border-radius: 50%; margin: 0 auto 14px; animation: sp .8s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .cert-card { max-width: 720px; margin: 0 auto; border: 8px solid var(--gold); padding: 36px; background: #fff; color: #111; text-align: center; }
    .cert-card h2 { margin: 8px 0; font-size: 32px; }
    @media (max-width: 860px) {
      .workspace { grid-template-columns: 1fr; grid-template-rows: 42% 58%; }
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="hdr">
    <div class="brand" id="goHome"><span class="mark">P</span> freePyCamp</div>
    <div class="hdr-right">
      <span class="py-status" id="pyStatus">Python: загрузка…</span>
      <span class="pill" id="progressPill">0%</span>
      <span id="mapLink" style="cursor:pointer">Карта курса</span>
    </div>
  </header>

  <div class="overlay" id="boot">
    <div>
      <div class="spin"></div>
      <h2>Готовим интерпретатор Python</h2>
      <p style="color:#afafc7">Pyodide загружается один раз — дальше код выполняется прямо в браузере.</p>
    </div>
  </div>

  <main id="app"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <script>
const COURSE = [
  {
    id: "intro",
    title: "1. Знакомство с Python",
    blurb: "Синтаксис, print и комментарии — ваш первый код.",
    lessons: [
      {
        id: "i1",
        title: "Что такое Python",
        theory: `<p>Python — язык общего назначения: на нём пишут сайты, анализ данных, автоматизацию и ИИ. Код читается почти как английский.</p>
<p>В этом курсе вы решаете задачи в браузере. Интерпретатор запускает настоящий Python 3.</p>
<p>Первая программа традиционно печатает приветствие.</p>`,
        task: "Используйте функцию <code>print</code>, чтобы вывести строку <code>Hello, Python!</code>.",
        starter: "# Ваш код ниже\n",
        hint: "print(\"Hello, Python!\")",
        tests: [{ d: "В консоли есть Hello, Python!", py: "assert 'Hello, Python!' in __stdout__" }]
      },
      {
        id: "i2",
        title: "Комментарии",
        theory: `<p>Комментарии начинаются с <code>#</code> и не выполняются. Они объясняют намерение, а не очевидные факты.</p>
<pre># Это комментарий\nprint("код")</pre>`,
        task: "Оставьте комментарий с текстом <code>курс Python</code> и напечатайте <code>ok</code>.",
        starter: "\nprint(\"ok\")\n",
        hint: "Добавьте строку: # курс Python",
        tests: [
          { d: "Есть комментарий «курс Python»", py: "assert 'курс Python' in user_code" },
          { d: "Печатается ok", py: "assert 'ok' in __stdout__" }
        ]
      },
      {
        id: "i3",
        title: "Несколько вызовов print",
        theory: `<p>Каждый <code>print</code> по умолчанию заканчивается переводом строки. Можно печатать числа и выражения.</p>`,
        task: "Напечатайте три строки: <code>A</code>, затем <code>B</code>, затем <code>C</code> — каждую через свой <code>print</code>.",
        starter: "",
        hint: "Три отдельных print.",
        tests: [{ d: "Вывод содержит A, B и C на отдельных строках", py: "lines=[ln.strip() for ln in __stdout__.splitlines() if ln.strip()]; assert lines[:3]==['A','B','C']" }]
      },
      {
        id: "i4",
        title: "sep и end",
        theory: `<p><code>print(1, 2, 3, sep='-')</code> склеит значения через дефис. <code>end=''</code> убирает перевод строки.</p>`,
        task: "Напечатайте <code>1-2-3</code> одним вызовом <code>print</code> (используйте <code>sep</code>).",
        starter: "print(1, 2, 3)\n",
        hint: "print(1, 2, 3, sep='-')",
        tests: [{ d: "Вывод содержит 1-2-3", py: "assert '1-2-3' in __stdout__.replace('\\n','')" }]
      },
      {
        id: "i5",
        title: "Исправьте синтаксис",
        theory: `<p>Python чувствителен к скобкам и кавычкам. Сообщение <code>SyntaxError</code> почти всегда значит: скобка, двоеточие или кавычка.</p>`,
        task: "Исправьте код так, чтобы он напечатал <code>fixed</code>.",
        starter: "print('fixed'\n",
        hint: "Закройте скобку.",
        tests: [{ d: "Печатается fixed", py: "assert 'fixed' in __stdout__" }]
      }
    ]
  },
  {
    id: "vars",
    title: "2. Переменные и типы",
    blurb: "Имена, числа, bool, None и преобразования.",
    lessons: [
      {
        id: "v1",
        title: "Присваивание",
        theory: `<p>Имя слева, значение справа: <code>age = 18</code>. Имена: буквы, цифры, подчёркивание; не с цифры.</p>`,
        task: "Создайте переменную <code>city</code> со значением <code>\"Moscow\"</code> и напечатайте её.",
        starter: "",
        hint: "city = \"Moscow\"",
        tests: [
          { d: "city равно Moscow", py: "assert city == 'Moscow'" },
          { d: "Moscow есть в выводе", py: "assert 'Moscow' in __stdout__" }
        ]
      },
      {
        id: "v2",
        title: "Целые и вещественные",
        theory: `<p><code>int</code> — целые, <code>float</code> — с точкой. <code>type(x)</code> возвращает тип.</p>`,
        task: "Создайте <code>n = 10</code> и <code>x = 2.5</code>. Напечатайте <code>type(n)</code> и <code>type(x)</code>.",
        starter: "",
        hint: "n = 10; x = 2.5",
        tests: [
          { d: "n это int 10", py: "assert n == 10 and isinstance(n, int)" },
          { d: "x это float 2.5", py: "assert x == 2.5 and isinstance(x, float)" }
        ]
      },
      {
        id: "v3",
        title: "Булевы значения",
        theory: `<p><code>True</code> и <code>False</code> — с большой буквы. Это отдельный тип <code>bool</code>.</p>`,
        task: "Присвойте <code>ready = True</code> и <code>done = False</code>.",
        starter: "",
        hint: "ready = True",
        tests: [
          { d: "ready is True", py: "assert ready is True" },
          { d: "done is False", py: "assert done is False" }
        ]
      },
      {
        id: "v4",
        title: "None",
        theory: `<p><code>None</code> означает «нет значения». Сравнивайте через <code>is None</code>.</p>`,
        task: "Создайте <code>result = None</code> и напечатайте <code>result is None</code>.",
        starter: "",
        hint: "result = None",
        tests: [{ d: "result is None", py: "assert result is None" }]
      },
      {
        id: "v5",
        title: "Преобразование типов",
        theory: `<p><code>int(\"42\")</code>, <code>float(\"3.14\")</code>, <code>str(10)</code>, <code>bool(0)</code> — ложь, любой ненулевой — истина.</p>`,
        task: "Из строки <code>raw = \"19\"</code> получите целое <code>age</code>.",
        starter: "raw = \"19\"\n",
        hint: "age = int(raw)",
        tests: [{ d: "age == 19 и это int", py: "assert age == 19 and type(age) is int" }]
      },
      {
        id: "v6",
        title: "Множественное присваивание",
        theory: `<p><code>a, b = 1, 2</code> и обмен: <code>a, b = b, a</code>.</p>`,
        task: "Даны <code>a, b = 5, 9</code>. Поменяйте их местами без третьей временной переменной в стиле «классический tmp» — используйте распаковку.",
        starter: "a, b = 5, 9\n",
        hint: "a, b = b, a",
        tests: [{ d: "a == 9 и b == 5", py: "assert a == 9 and b == 5" }]
      }
    ]
  },
  {
    id: "ops",
    title: "3. Операторы",
    blurb: "Арифметика, сравнения и логика.",
    lessons: [
      {
        id: "o1",
        title: "Арифметика",
        theory: `<p>Операторы: <code>+ - * / // % **</code>. Деление <code>/</code> всегда даёт float. <code>//</code> — целочисленное.</p>`,
        task: "Для <code>a, b = 17, 5</code> сохраните в <code>q</code> результат <code>a // b</code>, в <code>r</code> — <code>a % b</code>.",
        starter: "a, b = 17, 5\n",
        hint: "q = a // b; r = a % b",
        tests: [{ d: "q == 3 и r == 2", py: "assert q == 3 and r == 2" }]
      },
      {
        id: "o2",
        title: "Степень",
        theory: `<p><code>2 ** 10</code> равно 1024. Приоритет у <code>**</code> выше умножения.</p>`,
        task: "Вычислите <code>power = 3 ** 4</code>.",
        starter: "",
        hint: "power = 3 ** 4",
        tests: [{ d: "power == 81", py: "assert power == 81" }]
      },
      {
        id: "o3",
        title: "Сравнения",
        theory: `<p><code>== != < > <= >=</code> возвращают bool. Не путайте <code>=</code> и <code>==</code>.</p>`,
        task: "Запишите в <code>ok</code> результат проверки, что <code>score</code> не меньше 50.",
        starter: "score = 72\n",
        hint: "ok = score >= 50",
        tests: [{ d: "ok is True", py: "assert ok is True" }]
      },
      {
        id: "o4",
        title: "Логика",
        theory: `<p><code>and</code>, <code>or</code>, <code>not</code>. У <code>and</code> приоритет выше, чем у <code>or</code>.</p>`,
        task: "Переменная <code>access</code> должна быть истинна, если <code>age >= 18</code> и <code>has_ticket</code> истинно.",
        starter: "age = 20\nhas_ticket = True\n",
        hint: "access = age >= 18 and has_ticket",
        tests: [{ d: "access is True", py: "assert access is True" }]
      },
      {
        id: "o5",
        title: "Приоритет",
        theory: `<p>Сначала степень, затем унарный минус, потом * / // %, затем + -. Скобки всё меняют.</p>`,
        task: "Вычислите <code>value = 2 + 3 * 4 ** 2</code> (не меняйте выражение — просто присвойте) и поймите результат.",
        starter: "",
        hint: "4 ** 2 = 16, затем 3 * 16 = 48, плюс 2.",
        tests: [{ d: "value == 50", py: "assert value == 50" }]
      }
    ]
  },
  {
    id: "str",
    title: "4. Строки",
    blurb: "Индексы, срезы, методы и f-строки.",
    lessons: [
      {
        id: "s1",
        title: "Создание строк",
        theory: `<p>Кавычки одинарные или двойные. Тройные — многострочный текст. Сложение строк — конкатенация.</p>`,
        task: "Соберите <code>msg = \"Hello\" + \" \" + \"World\"</code>.",
        starter: "",
        hint: "Сложите три куска.",
        tests: [{ d: "msg == 'Hello World'", py: "assert msg == 'Hello World'" }]
      },
      {
        id: "s2",
        title: "Индексация",
        theory: `<p>Первый символ — индекс 0. Отрицательные индексы считают с конца: <code>s[-1]</code> — последний.</p>`,
        task: "Для <code>word = \"Python\"</code> сохраните первый символ в <code>first</code>, последний в <code>last</code>.",
        starter: "word = \"Python\"\n",
        hint: "first = word[0]; last = word[-1]",
        tests: [{ d: "first == 'P' и last == 'n'", py: "assert first == 'P' and last == 'n'" }]
      },
      {
        id: "s3",
        title: "Срезы",
        theory: `<p><code>s[start:stop:step]</code> — stop не входит. <code>s[::-1]</code> разворачивает строку.</p>`,
        task: "Из <code>text = \"algorithm\"</code> получите <code>part = text[0:4]</code> и <code>rev = text[::-1]</code>.",
        starter: "text = \"algorithm\"\n",
        hint: "part = text[0:4]",
        tests: [{ d: "part == 'algo' и rev перевёрнут", py: "assert part == 'algo' and rev == 'mhtirogla'" }]
      },
      {
        id: "s4",
        title: "Методы строк",
        theory: `<p>Полезные методы: <code>lower</code>, <code>upper</code>, <code>strip</code>, <code>replace</code>, <code>startswith</code>.</p>`,
        task: "Нормализуйте <code>name = \"  Ada Lovelace  \"</code>: обрежьте пробелы и сделайте заголовочный регистр в <code>clean</code> (<code>title</code>).",
        starter: "name = \"  Ada Lovelace  \"\n",
        hint: "clean = name.strip().title()",
        tests: [{ d: "clean == 'Ada Lovelace'", py: "assert clean == 'Ada Lovelace'" }]
      },
      {
        id: "s5",
        title: "split и join",
        theory: `<p><code>\"a,b,c\".split(\",\")</code> → список. <code>\",\".join(list)</code> собирает обратно.</p>`,
        task: "Разбейте <code>csv = \"red,green,blue\"</code> в список <code>colors</code>. Затем соберите <code>line</code> через дефис.",
        starter: "csv = \"red,green,blue\"\n",
        hint: "colors = csv.split(','); line = '-'.join(colors)",
        tests: [{ d: "colors и line верны", py: "assert colors == ['red','green','blue'] and line == 'red-green-blue'" }]
      },
      {
        id: "s6",
        title: "f-строки",
        theory: `<p>f-строка: <code>f\"{name} is {age}\"</code>. Можно выражения: <code>f\"{n:.2f}\"</code>.</p>`,
        task: "Для <code>user = \"Anton\"</code> и <code>n = 7</code> создайте <code>s = f\"{user} solved {n} lessons\"</code>.",
        starter: "user = \"Anton\"\nn = 7\n",
        hint: "s = f\"{user} solved {n} lessons\"",
        tests: [{ d: "строка собрана", py: "assert s == 'Anton solved 7 lessons'" }]
      },
      {
        id: "s7",
        title: "in и len",

const STORE = "freepycamp-v1";
let pyodide = null;
let editor = null;
let currentId = null;
let view = "home";
let completed = new Set();
let drafts = {};

function allLessons() {
  return COURSE.flatMap(s => s.lessons.map(l => ({ ...l, section: s.title, sectionId: s.id })));
}
function findLesson(id) { return allLessons().find(l => l.id === id); }
function lessonIndex(id) { return allLessons().findIndex(l => l.id === id); }
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || "{}");
    completed = new Set(s.completed || []);
    drafts = s.drafts || {};
  } catch (e) { completed = new Set(); drafts = {}; }
}
function saveState() {
  localStorage.setItem(STORE, JSON.stringify({ completed: [...completed], drafts }));
}
function progress() {
  const n = allLessons().length;
  return n ? Math.round(100 * completed.size / n) : 0;
}

function render() {
  document.getElementById("progressPill").textContent = progress() + "%";
  if (view === "home" || view === "map") renderHome();
  else renderLesson();
}

function renderHome() {
  const cert = progress() === 100;
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="home">
      <div class="hero">
        <h1>Изучите Python бесплатно</h1>
        <p>Аналог freeCodeCamp: теория слева, редактор справа, автопроверка тестами и сертификат, когда пройден весь трек. Код выполняется в браузере на настоящем Python 3.</p>
        <div class="cta">
          <button class="btn" id="startBtn">${completed.size ? "Продолжить" : "Начать курс"}</button>

    openLesson(next.id);
  };
  document.getElementById("resetBtn").onclick = () => {
    if (confirm("Сбросить прогресс и черновики?")) {
      completed = new Set(); drafts = {}; saveState(); render();
    }
  };
  app.querySelectorAll(".lesson-row").forEach(a => {
    a.onclick = e => { e.preventDefault(); openLesson(a.dataset.id); };
  });
  const sc = document.getElementById("showCert");
  if (sc) sc.onclick = () => {
    const name = (document.getElementById("certName").value || "Student").trim();
    document.getElementById("certMount").innerHTML = `
      <div class="cert-card">
        <div style="letter-spacing:4px;color:#666">FREEPYCAMP</div>
        <h2>Python Developer</h2>
        <p>Настоящим подтверждается, что</p>
        <h2>${name}</h2>
        <p>успешно завершил(а) полный практический курс Python: синтаксис, структуры данных, функции, ООП, алгоритмы и выпускные проекты.</p>
        <p><b>${allLessons().length} уроков · ${COURSE.length} разделов</b></p>
      </div>`;
  };
}

function openLesson(id) {
  if (currentId && editor) drafts[currentId] = editor.getValue();
  currentId = id;
  view = "lesson";
  saveState();
  renderLesson();
}

function renderLesson() {
  const L = findLesson(currentId);
  if (!L) { view = "home"; renderHome(); return; }
  const idx = lessonIndex(currentId);
  const list = allLessons();
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="workspace">
      <aside class="instr">
        <div class="crumb">${L.section} · урок ${idx+1} из ${list.length}</div>
        <h1>${L.title}</h1>
        ${L.theory}
        <h2>Задание</h2>
        <div>${L.task}</div>
        <h2>Тесты</h2>
        <div class="tests" id="testList">${L.tests.map((t,i)=>`<div class="test" id="t${i}">${t.d}</div>`).join("")}</div>
        <div class="hint" id="hintBox"><b>Подсказка:</b> ${L.hint}</div>
      </aside>
      <section class="right">
        <div class="toolbar">
          <button class="tbtn primary" id="runBtn">Run</button>
          <button class="tbtn primary" id="checkBtn">Check tests</button>
          <button class="tbtn" id="hintBtn">Hint</button>
          <button class="tbtn" id="resetCode">Reset</button>
          <button class="tbtn" id="toMap">Карта</button>
        </div>
        <textarea id="code"></textarea>
        <div class="console" id="console">Консоль готова. Ctrl+Enter — Run.</div>
        <div class="navless">
          <button class="tbtn" id="prevBtn" ${idx===0?"disabled":""}>← Назад</button>
          <button class="tbtn" id="nextBtn" ${idx===list.length-1?"disabled":""}>Дальше →</button>
        </div>
      </section>
    </div>`;
  const start = drafts[L.id] != null ? drafts[L.id] : L.starter;
  editor = CodeMirror.fromTextArea(document.getElementById("code"), {
    mode: "python", theme: "material-darker", lineNumbers: true, indentUnit: 4, tabSize: 4,
    extraKeys: { "Ctrl-Enter": () => runCode(false), "Cmd-Enter": () => runCode(false) }
  });
  editor.setValue(start);
  document.getElementById("runBtn").onclick = () => runCode(false);
  document.getElementById("checkBtn").onclick = () => runCode(true);
  document.getElementById("hintBtn").onclick = () => document.getElementById("hintBox").classList.toggle("show");
  document.getElementById("resetCode").onclick = () => { editor.setValue(L.starter); delete drafts[L.id]; saveState(); };
  document.getElementById("toMap").onclick = () => { drafts[L.id] = editor.getValue(); saveState(); view = "map"; render(); };
  document.getElementById("prevBtn").onclick = () => { if (idx>0) openLesson(list[idx-1].id); };
  document.getElementById("nextBtn").onclick = () => { if (idx<list.length-1) openLesson(list[idx+1].id); };
}

function setConsole(text, isErr) {
  const el = document.getElementById("console");
  if (!el) return;
  el.innerHTML = isErr ? `<span class="err">${escapeHtml(text)}</span>` : escapeHtml(text || "(нет вывода)");
}
function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
}

async function runCode(check) {
  const L = findLesson(currentId);
  const code = editor.getValue();
  drafts[currentId] = code;
  saveState();
  const cons = document.getElementById("console");
  cons.textContent = "Выполнение…";
  try {
    pyodide.globals.set("user_code", code);
    await pyodide.runPythonAsync(`
import sys, io, traceback
__buf = io.StringIO()
__old = sys.stdout
sys.stdout = __buf
__ns = {"__name__": "__main__"}
__err = None
try:
    exec(compile(user_code, "<user>", "exec"), __ns, __ns)
except Exception:
    __err = traceback.format_exc()
finally:
    sys.stdout = __old
__stdout__ = __buf.getvalue()
__ns["__stdout__"] = __stdout__
__ns["user_code"] = user_code
`);
    const stdout = pyodide.globals.get("__stdout__") || "";
    const err = pyodide.globals.get("__err");
    if (err) {
      setConsole(err, true);
      return;
    }
    if (!check) {
      setConsole(stdout || "(нет вывода)", false);
      return;
    }
    const results = [];
    for (let i = 0; i < L.tests.length; i++) {
      const t = L.tests[i];
      pyodide.globals.set("test_src", t.py);
      await pyodide.runPythonAsync(`
__test_ok = True
__test_err = ""
try:
    exec(compile(test_src, "<test>", "exec"), __ns, __ns)
except Exception as e:
    __test_ok = False
    __test_err = str(e)
`);
      const ok = pyodide.globals.get("__test_ok");
      const te = pyodide.globals.get("__test_err") || "";
      results.push({ ok, te, d: t.d });
      const node = document.getElementById("t" + i);
      if (node) {
        node.className = "test " + (ok ? "pass" : "fail");
        node.textContent = (ok ? "✓ " : "✗ ") + t.d + (ok ? "" : " — " + te);
      }
    }
    const allOk = results.every(r => r.ok);
    if (allOk) {
      completed.add(L.id);
      saveState();
      document.getElementById("progressPill").textContent = progress() + "%";
      setConsole((stdout ? stdout + "\n" : "") + "Все тесты пройдены. Урок засчитан.", false);
    } else {
      setConsole((stdout ? stdout + "\n" : "") + "Есть ошибки в тестах. Смотрите панель слева.", true);
    }
  } catch (e) {
    setConsole(String(e), true);
  }
}

document.getElementById("goHome").onclick = () => {
  if (editor && currentId) { drafts[currentId] = editor.getValue(); saveState(); }
  view = "home"; render();
};
document.getElementById("mapLink").onclick = () => {
  if (editor && currentId) { drafts[currentId] = editor.getValue(); saveState(); }
  view = "map"; render();
};

loadState();
render();

(async () => {
  try {
    pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" });
    document.getElementById("pyStatus").textContent = "Python 3 готов";
    document.getElementById("pyStatus").classList.add("ready");
    document.getElementById("boot").classList.add("hidden");
  } catch (e) {
    document.getElementById("boot").innerHTML = "<div><h2>Не удалось загрузить Pyodide</h2><p>Нужен интернет для CDN.</p></div>";
  }
})();
  </script>
